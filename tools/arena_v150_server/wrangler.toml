name = "wordquest-arena-v150-free"
main = "free_worker.mjs"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ArenaRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ArenaRoom"]

[vars]
FIREBASE_PROJECT_ID = "REPLACE_WITH_PROJECT_ID"
FIREBASE_WEB_API_KEY = "REPLACE_WITH_FIREBASE_WEB_API_KEY"
FIREBASE_DATABASE_URL = "REPLACE_WITH_DATABASE_URL"
