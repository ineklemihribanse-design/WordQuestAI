name: Build WordQuest AI v0.8.0 APK
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Retrieve v0.8.0 source package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download source-v0.8.0 --repo "${{ github.repository }}" --pattern 'WordQuest_AI_v0.8.0_IPA_Offline_Tam_Kaynak.zip' --dir /tmp
          unzip -q /tmp/WordQuest_AI_v0.8.0_IPA_Offline_Tam_Kaynak.zip -d /tmp/wq
          test -f /tmp/wq/A1KelimeBulmacasi/gradlew
          cp -a /tmp/wq/A1KelimeBulmacasi/. .
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify voice and IPA data
        run: python3 tools/verify_audio_ipa.py
      - name: Compile and test APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testOfflineUnitTest :app:assembleOffline
      - name: Verify APK signature
        run: |
          APK="$(find app/build/outputs/apk/offline -type f -name '*.apk' | head -1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -10
      - uses: actions/upload-artifact@v4
        with:
          name: WordQuestAI-v0.8.0-APK
          path: app/build/outputs/apk/offline/*.apk
          if-no-files-found: error
          retention-days: 14
