name: Verify WordQuest 1.0.86 Package 3 - no release

on:
  push:
    branches:
      - feature/v186-package3-word-memory
    paths:
      - 'tools/v186/package3_word_memory_186.b64'
      - '.github/workflows/verify-word-memory-package3-v186.yml'

permissions:
  contents: read

jobs:
  verify-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable Package 3 source ZIP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p3"
          base64 --decode tools/v186/package3_word_memory_186.b64 > "$RUNNER_TEMP/p3.zip"
          echo "6ebcbeee331e7f115324838c905aa9aab56bb5a7e6e819b337744e4d6260db68  $RUNNER_TEMP/p3.zip" | sha256sum -c -
          unzip -tq "$RUNNER_TEMP/p3.zip"
          unzip -oq "$RUNNER_TEMP/p3.zip" -d "$RUNNER_TEMP/p3"
          test -s "$RUNNER_TEMP/p3/WordQuestAI_Paket3_KelimeHafizam_186/README_PAKET3_TR.md"
      - name: Run regression tests against the v1.0.85 source
        env:
          WQ_TEST_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 -m py_compile "$RUNNER_TEMP/p3/WordQuestAI_Paket3_KelimeHafizam_186/tools/v186/apply_memory_package3_186.py"
          python3 -m unittest discover -s "$RUNNER_TEMP/p3/WordQuestAI_Paket3_KelimeHafizam_186/tests" -p test_package3.py -v
      - name: Confirm stage-only with no APK release
        run: |
          echo 'PASS: Package 3 source-only; no Firebase changes, app-version bump, APK signing, or release.'
