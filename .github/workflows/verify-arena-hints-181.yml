name: Test limited live Arena hint rules (v1.0.81)
on:
  push:
    branches: [feature/v175-comprehensive-learning-update]
    paths:
      - '.github/workflows/verify-arena-hints-181.yml'
      - 'scripts/test-arena-hints-181.mjs'
      - 'firebase/database.rules.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hints:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse complete existing RTDB rules without dropping accounts or Arena
        run: |
          set -euo pipefail
          python3 -m json.tool firebase/database.rules.json >/dev/null
          printf '{"database":{"rules":"firebase/database.rules.json"},"emulators":{"database":{"host":"127.0.0.1","port":9002},"ui":{"enabled":false}}}\n' > firebase.json
      - name: Install local no-billing Firebase emulator and rules test SDK
        run: npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@latest
      - name: Verify only authorized per-turn hints are accepted
        run: npx firebase emulators:exec --project demo-wordquest-hints-181 --only database "node scripts/test-arena-hints-181.mjs"
