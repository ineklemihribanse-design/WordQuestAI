name: Publish verified WordQuest AI 1.0.140 Arena recorded tablet and solo UI repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v140-arena-video-repair.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wordquest-public-release
  # Supersede the older candidate before publication; do not publish known room-create bug.
  cancel-in-progress: true
env:
  WQ_VERSION: '1.0.140'
  WQ_BASE_VERSION: '1.0.138'
  WQ_TARGET_CODE: '159'
  WQ_BASE_CODE: '158'
  WQ_BASE_SHA: '9a95b9ad1ffb54db5b1fcce141967370aa8b90c2f7c4d91c78393a11dacabea2'
  WQ_SOURCE_SHA: '8583db948ca809a0ab7727cae77028e50bc0c462'
  WQ_NOTES: 'Arena: mor-altın tek kişilik oyun ekranları, yatay tablette tam tahta ve yan yana cevap paneli, gerçek karma seviye başlığı, tek soru sayısı seçimi ve temiz menüye dönüş. Yerel motor, imza, Firebase ve ana bulmaca tahtası korunur.'
  WQ_QA_RUN: '45696004897'
jobs:
  upgrade:
    if: github.repository == 'ineklemihribanse-design/WordQuestAI'
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8583db948ca809a0ab7727cae77028e50bc0c462
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: verified-ui-harness
          persist-credentials: false
      - name: Set shared directory
        run: echo "WQ_RELEASE_DIR=$RUNNER_TEMP/wq-auto-release" >> "$GITHUB_ENV"
      - name: Verify exact successful QA and obtain existing signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45696005369" > /tmp/wq125-rules.json
          # Rule bytes are unchanged from the successfully tested 1.0.138 release.
          for attempt in $(seq 1 80); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/45696005369" > /tmp/wq125-rules.json
            if [ "$(jq -r .status /tmp/wq125-rules.json)" = completed ]; then break; fi
            sleep 15
          done
          jq -e --arg sha "$WQ_SOURCE_SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$sha' /tmp/wq125-rules.json
          # Wait only for the exact pinned candidate; never select an unrelated newer run.
          for attempt in $(seq 1 80); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WQ_QA_RUN" > /tmp/wq124-run.json
            jq -e --arg sha "$WQ_SOURCE_SHA" '.head_sha==$sha and .head_branch=="feature/v132-hybrid-engine"' /tmp/wq124-run.json
            if [ "$(jq -r .status /tmp/wq124-run.json)" = completed ]; then break; fi
            sleep 15
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45696005103" > /tmp/wq132-engine-tests.json
          jq -e --arg sha "$WQ_SOURCE_SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$sha' /tmp/wq132-engine-tests.json
          jq -e --arg sha "$WQ_SOURCE_SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$sha and .head_branch=="feature/v132-hybrid-engine"' /tmp/wq124-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WQ_QA_RUN/jobs?per_page=100" > /tmp/wq124-jobs.json
          python3 - <<'PY'
          import json
          good={s['name'] for j in json.load(open('/tmp/wq124-jobs.json'))['jobs'] for s in j['steps'] if s['conclusion']=='success'}
          assert {'Integrate signed data-only content updater and run packer tests','Run complete offline tests and build experimental unsigned APK in one Gradle invocation','Sign v1.0.140 with current installed-app production certificate','Preserve signed content updater candidate for separate device testing'} <= good
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v$WQ_BASE_VERSION"
          mkdir -p "$WQ_RELEASE_DIR/"{base,signed,delta,classes}
          gh run download "$WQ_QA_RUN" -R "$GITHUB_REPOSITORY" -n WordQuestAI-v1.0.140-signed-hybrid-engine-QA -D "$WQ_RELEASE_DIR/signed"
          gh release download "v$WQ_BASE_VERSION" -R "$GITHUB_REPOSITORY" -p WordQuestAI.apk -p update.json -D "$WQ_RELEASE_DIR/base"
          test -s "$WQ_RELEASE_DIR/signed/WordQuestAI-v1.0.140-signed-qa.apk"
          echo "$WQ_BASE_SHA  $WQ_RELEASE_DIR/base/WordQuestAI.apk" | sha256sum -c -
      - name: Verify signed APK and prepare compatible delta manifest
        run: |
          set -euo pipefail
          D="$WQ_RELEASE_DIR"
          if [ ! -s "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ]; then
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
            "$SDKM" --install 'build-tools;35.0.0'
          fi
          apk="$D/signed/WordQuestAI-v1.0.140-signed-qa.apk"
          java -jar "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verify --verbose --print-certs "$apk" > "$D/signature.txt"
          grep -Fiq 'Signer #1 certificate SHA-256 digest: 29f9449cef86e511bb8256ca1db58580ff88dd1badd034ff79b81c6df662bce6' "$D/signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$D/signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$D/signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$D/badging.txt"
          grep -Fq "name='com.kelimebulmacasi.a1.practice.fresh'" "$D/badging.txt"
          grep -Fq "versionCode='159'" "$D/badging.txt"
          grep -Fq "versionName='1.0.140'" "$D/badging.txt"
          ! grep -Fq 'application-debuggable' "$D/badging.txt"
          unzip -tq "$apk"
          python3 - <<'PY'
          import os,json,hashlib,zipfile
          from pathlib import Path
          d=Path(os.environ['WQ_RELEASE_DIR'])
          p=d/'signed/WordQuestAI-v1.0.140-signed-qa.apk'
          with p.open('rb') as f: h=hashlib.file_digest(f,'sha256').hexdigest()
          with zipfile.ZipFile(p) as z:
              dex=[z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')]
              for cls in (b'WqContentInitProvider',b'Wq130WebLobby',b'Wq130WebBundle',b'Wq132WebEngine',b'Wq132RoomSettings',b'Wq136RecoveryEngine',b'Wq140ArenaFit'):
                  assert any(cls in d for d in dex),cls
              assert z.read('assets/web/arena_lobby.html').startswith(b'<!DOCTYPE html>')
              assert 'assets/design/arena_lobby.json' in z.namelist()
              (d/'arena_engine.html').write_bytes(z.read('assets/web/arena_engine.html'))
              (d/'arena-vocabulary-v1.json').write_bytes(z.read('assets/arena-vocabulary-v1.json'))
          m=dict(schemaVersion=1,tag='v1.0.140',versionCode=159,versionName='1.0.140',packageName='com.kelimebulmacasi.a1.practice.fresh',apkFile='WordQuestAI.apk',sizeBytes=p.stat().st_size,sha256=h,notes=os.environ['WQ_NOTES'])
          (d/'signed/update.json').write_text(json.dumps(m))
          PY
          node tools/v132_engine/smoke_bundle.mjs "$D/arena_engine.html" "$D/arena-vocabulary-v1.json"
          node tools/v132_engine/test_transport.mjs "$D/arena_engine.html" "$D/arena-vocabulary-v1.json"
          python3 tools/delta_v1/make_delta.py "$D/base/WordQuestAI.apk" "$apk" "$D/base/update.json" "$D/signed/update.json" "$D/delta"
          python3 - <<'PY'
          import os,json,shutil
          from pathlib import Path
          d=Path(os.environ['WQ_RELEASE_DIR'])
          r=json.loads((d/'delta/delta-report.json').read_text())
          assert r['eligible'], 'Delta too large; no silent full APK fallback'
          m=json.loads((d/'signed/update.json').read_text())
          m['deltas']=[r['delta']]
          for dest in ('signed','delta'):
              (d/dest/'update.json').write_text(json.dumps(m))
          shutil.copyfile(d/'delta/delta-report.json',d/'signed/delta-report.json')
          PY
          python3 tools/auto_release/prepare.py
          javac -d "$D/classes" tools/delta_android/WqDeltaApplier.java
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Reconstruct installed APK and verify Android upgrade without uninstall
        timeout-minutes: 55
        run: |
          set -euo pipefail
          # Run the established upgrade proof AND six-level real Android gameplay
          # within the same emulator session before any public release.
          cp verified-ui-harness/tools/v132_runtime/qa_engine_ui_v140.py "$RUNNER_TEMP/wq134-gameplay.py"
          cat > "$RUNNER_TEMP/wq134-upgrade-and-gameplay.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          bash tools/auto_release/verify_delta_install.sh
          python3 -c 'import PIL' || python3 -m pip install --disable-pip-version-check Pillow
          python3 "$RUNNER_TEMP/wq134-gameplay.py"
          SH
          bash tools/auto_release/run_emulator.sh "$RUNNER_TEMP/wq134-upgrade-and-gameplay.sh" "$WQ_RELEASE_DIR/target.apk"
          grep -Fq 'PASS: actual Android mixed crossword gameplay opens' "$RUNNER_TEMP/wq206-upgrade-qa.log"
          grep -Fq 'PASS: actual Android web quiz gameplay opens' "$RUNNER_TEMP/wq206-upgrade-qa.log"
          grep -Fq 'PASS: landscape Arena board, answers and mixed-level title' "$RUNNER_TEMP/wq206-upgrade-qa.log"
          grep -Fq 'PASS: landscape Arena quiz and clean return' "$RUNNER_TEMP/wq206-upgrade-qa.log"
          sha256sum -c "$RUNNER_TEMP/wq206-upgrade-passed.sha256"
          cp "$RUNNER_TEMP/wq206-upgrade-passed.sha256" "$WQ_RELEASE_DIR/upgrade-proof.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: WordQuestAI-v1.0.140-verified-release
          path: |
            ${{ runner.temp }}/wq-auto-release/dist
            ${{ runner.temp }}/wq-auto-release/upgrade-proof.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WordQuestAI-v1.0.140-device-diagnostics
          path: |
            ${{ runner.temp }}/wq-auto-release/report.json
            ${{ runner.temp }}/wq-auto-release/before.txt
            ${{ runner.temp }}/wq-auto-release/after.txt
            ${{ runner.temp }}/wq-auto-release/startup.png
            ${{ runner.temp }}/wq-auto-release/arena-*.png
            ${{ runner.temp }}/wq-auto-release/arena-*.xml
            ${{ runner.temp }}/wq206-upgrade-qa.log
            ${{ runner.temp }}/wq206-emulator.log
          if-no-files-found: ignore
          retention-days: 7
  publish:
    needs: upgrade
    if: needs.upgrade.result == 'success'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WordQuestAI-v1.0.140-verified-release
          path: ${{ runner.temp }}/verified
      - name: Validate final signed bytes, draft, upload and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/verified"
          export D
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          d=Path(os.environ['D']); out=d/'dist'; m=json.loads((out/'update.json').read_text()); p=m['deltas'][0]
          def sha(f):
              with f.open('rb') as s:return hashlib.file_digest(s,'sha256').hexdigest()
          assert m['versionName']==os.environ['WQ_VERSION'] and m['versionCode']==int(os.environ['WQ_TARGET_CODE'])
          assert p['fromVersionCode']==int(os.environ['WQ_BASE_CODE']) and p['baseSha256']==os.environ['WQ_BASE_SHA']
          assert sha(out/'WordQuestAI.apk')==m['sha256']==p['targetSha256']==(d/'upgrade-proof.sha256').read_text().split()[0]
          assert sha(out/p['file'])==p['sha256'] and (out/p['file']).stat().st_size==p['sizeBytes']
          assert {f.name for f in out.iterdir()}=={'WordQuestAI.apk','update.json',p['file']}
          PY
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          TAG="v$WQ_VERSION"
          if [ "$latest" != "$TAG" ] && [ "$latest" != "v$WQ_BASE_VERSION" ]; then
            echo "::error::Production base changed; refusing outdated publication"
            exit 1
          fi
          # Create draft separately from large asset uploads; recover transient 502s.
          ID=""
          for attempt in $(seq 1 5); do
            ID=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId 2>/dev/null || true)
            if [ -n "$ID" ]; then break; fi
            test "$latest" = "v$WQ_BASE_VERSION"
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$WQ_SOURCE_SHA" --draft --title "WordQuest AI $WQ_VERSION" --notes "$WQ_NOTES" || true
            sleep 5
          done
          ID=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" > "$D/uploaded.json"
          jq -e --arg sha "$WQ_SOURCE_SHA" --arg tag "$TAG" '.target_commitish==$sha and .tag_name==$tag and .prerelease==false' "$D/uploaded.json"
          for file in "$D/dist/"*; do
            name=$(basename "$file")
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            size=$(stat -c '%s' "$file")
            for attempt in $(seq 1 4); do
              gh api "repos/$GITHUB_REPOSITORY/releases/$ID" > "$D/uploaded.json"
              if jq -e --arg n "$name" --arg d "$digest" --argjson z "$size" '.assets|any(.name==$n and .state=="uploaded" and .digest==$d and .size==$z)' "$D/uploaded.json" >/dev/null; then break; fi
              jq -e '.draft==true' "$D/uploaded.json"
              # Never overwrite a pre-existing asset or publish an unverified draft.
              jq -e --arg n "$name" 'all(.assets[]; .name!=$n)' "$D/uploaded.json"
              gh release upload "$TAG" "$file" -R "$GITHUB_REPOSITORY" || true
              sleep 4
            done
            gh api "repos/$GITHUB_REPOSITORY/releases/$ID" > "$D/uploaded.json"
            jq -e --arg n "$name" --arg d "$digest" --argjson z "$size" '.assets|any(.name==$n and .state=="uploaded" and .digest==$d and .size==$z)' "$D/uploaded.json"
          done
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          d=Path(os.environ['D']);r=json.loads((d/'uploaded.json').read_text())
          assert r['tag_name']=='v'+os.environ['WQ_VERSION'] and not r['prerelease']
          assert r['target_commitish']==os.environ['WQ_SOURCE_SHA']
          files={f.name:f for f in (d/'dist').iterdir()}
          assert len(r['assets'])==3 and set(files)=={a['name'] for a in r['assets']}
          for a in r['assets']:
              f=files[a['name']]
              with f.open('rb') as s: digest=hashlib.file_digest(s,'sha256').hexdigest()
              assert a['state']=='uploaded' and a['size']==f.stat().st_size and a['digest']=='sha256:'+digest
          print('PASS: uploaded assets equal emulator-tested bytes')
          PY
          # The server may accept PATCH but return an empty or truncated JSON body.
          # Do not parse the write response. Read back the release and latest endpoint instead.
          for attempt in $(seq 1 18); do
            if gh api "repos/$GITHUB_REPOSITORY/releases/$ID" > "$D/state.json" && jq -e --arg tag "$TAG" '.tag_name==$tag and .draft==false and .prerelease==false' "$D/state.json" >/dev/null 2>&1; then
              if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$D/latest.json" && jq -e --arg tag "$TAG" --argjson id "$ID" '.tag_name==$tag and .id==$id and .draft==false' "$D/latest.json" >/dev/null 2>&1; then
                echo "PASS: $TAG is live on installed-app update channel"
                exit 0
              fi
              echo "Release is public; waiting for latest endpoint"
            elif jq -e --arg tag "$TAG" '.tag_name==$tag and .draft==true and .prerelease==false' "$D/state.json" >/dev/null 2>&1; then
              if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$D/latest.json" && jq -e --arg base "v$WQ_BASE_VERSION" '.tag_name==$base' "$D/latest.json" >/dev/null 2>&1; then
                echo "Finalizing verified draft (attempt $attempt)"
                gh api --method PATCH --silent "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true || echo "Publish response failed; checking server state before retry"
              fi
            else
              echo "Release status response not available; retrying read"
            fi
            sleep 10
          done
          echo "::error::Public release not confirmed after bounded retries; verified draft preserved"
          exit 1

  content:
    needs: publish
    if: needs.publish.result == 'success'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORE_TAG: v1.0.140
      CORE_CODE: '159'
      CONTENT_VERSION: '1.0.141'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 8583db948ca809a0ab7727cae77028e50bc0c462
          path: verified-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: WordQuestAI-v1.0.140-verified-release
          path: ${{ runner.temp }}/verified-content
      - name: Assemble and validate cumulative signed web and design content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$CORE_TAG"
          mkdir -p "$RUNNER_TEMP/content-base" "$RUNNER_TEMP/content-out/objects"
          gh release download "$CORE_TAG" -R "$GITHUB_REPOSITORY" -p WordQuestAI.apk -p update.json -D "$RUNNER_TEMP/content-base"
          CORE_SHA="$(cut -d" " -f1 "$RUNNER_TEMP/verified-content/upgrade-proof.sha256")"
          export CORE_SHA
          echo "$CORE_SHA  $RUNNER_TEMP/content-base/WordQuestAI.apk" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,os,sys,zipfile
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          src=Path('verified-source')
          sys.path.insert(0,str(src/'tools/content_updates'))
          from web_bundle import validate as validate_web
          from lobby_design import validate as validate_design
          from engine_bundle import validate as validate_engine
          out=base/'content-out'
          m=json.loads((base/'content-base/update.json').read_text())
          assert m['versionCode']==int(os.environ['CORE_CODE']) and m['sha256']==os.environ['CORE_SHA']
          files={'web/arena_lobby.html':((src/'tools/v130_web/content131/web/arena_lobby.html').read_bytes(),validate_web),
                 'design/arena_lobby.json':((src/'tools/v128_lobby/content129/design/arena_lobby.json').read_bytes(),validate_design)}
          entries=[]
          with zipfile.ZipFile(base/'content-base/WordQuestAI.apk') as z:
              files['web/arena_engine.html']=(z.read('assets/web/arena_engine.html'),validate_engine)
              for name,(data,validator) in sorted(files.items()):
                  validator(data)
                  if name!='web/arena_engine.html': assert z.read('assets/'+name)!=data,name
                  h=hashlib.sha256(data).hexdigest()
                  (out/'objects'/(h+Path(name).suffix)).write_bytes(data)
                  entries.append(dict(path=name,sha256=h,size=len(data)))
          payload=dict(schema=1,packageName=m['packageName'],coreCode=m['versionCode'],version=os.environ['CONTENT_VERSION'],sequence=1,files=entries)
          (base/'content-payload.json').write_bytes(json.dumps(payload,separators=(',',':'),sort_keys=True).encode())
          print('PASS: cumulative signed lobby, design and tested engine baseline;',sum(e['size'] for e in entries),'bytes')
          PY
      - name: Sign manifest using existing APK signing certificate
        env:
          WQ_RELEASE_KEYSTORE_B64: ${{ secrets.WQ_RELEASE_KEYSTORE_B64 }}
          WQ_STORE_PASS: ${{ secrets.WQ_UPGRADE_STORE_PASSWORD }}
          WQ_KEY_ALIAS: ${{ secrets.WQ_UPGRADE_KEY_ALIAS }}
          WQ_KEY_PASS: ${{ secrets.WQ_UPGRADE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$WQ_RELEASE_KEYSTORE_B64" && test -n "$WQ_STORE_PASS" && test -n "$WQ_KEY_ALIAS" && test -n "$WQ_KEY_PASS"
          umask 077
          key="$RUNNER_TEMP/content-signing.p12"
          trap 'rm -f "$key"' EXIT
          printf %s "$WQ_RELEASE_KEYSTORE_B64" | base64 -d > "$key"
          java tools/content_channel/SignContent.java "$key" "$RUNNER_TEMP/content-payload.json" "$RUNNER_TEMP/content-out/index.json"
      - name: Publish immutable content files and manifest after verified Android publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$CORE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin refs/heads/content-channel:refs/remotes/origin/content-channel
          git switch --detach refs/remotes/origin/content-channel
          python3 - <<'PY'
          import base64,hashlib,json,os,shutil
          from pathlib import Path
          here=Path('.')
          out=Path(os.environ['RUNNER_TEMP'])/'content-out'
          old=json.loads(base64.b64decode(json.loads((here/'index.json').read_text())['payload']))
          new=json.loads(base64.b64decode(json.loads((out/'index.json').read_text())['payload']))
          assert new['coreCode']==159 and new['version']=='1.0.141' and new['schema']==1
          if old!=new:
              assert old['coreCode']==158 and old['version']=='1.0.139','Unexpected content channel'
              for obj in (out/'objects').iterdir():
                  assert obj.suffix in ('.html','.json')
                  assert obj.name==hashlib.sha256(obj.read_bytes()).hexdigest()+obj.suffix
                  dest=here/'objects'/obj.name
                  if dest.exists(): assert dest.read_bytes()==obj.read_bytes()
                  else: shutil.copyfile(obj,dest)
              shutil.copyfile(out/'index.json',here/'index.json')
          PY
          git add -- index.json objects
          if ! git diff --cached --quiet; then
            git commit -m "Signed hybrid web and design content 1.0.141 for core 159"
            git push origin HEAD:refs/heads/content-channel
          fi
          echo "Content 1.0.141 published for Android core 159; no APK installation." >> "$GITHUB_STEP_SUMMARY"
