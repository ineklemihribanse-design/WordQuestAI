name: Verify private WordQuest friend profile rules (v1.0.80)
on:
  push:
    branches: [feature/v175-comprehensive-learning-update]
    paths:
      - '.github/workflows/verify-friend-profiles-180.yml'
      - 'scripts/test-friend-profiles-180.mjs'
      - 'firebase/database.rules.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate complete current Firebase Realtime Database rules
        run: |
          set -euo pipefail
          python3 -m json.tool firebase/database.rules.json >/dev/null
          printf '{"database":{"rules":"firebase/database.rules.json"},"emulators":{"database":{"host":"127.0.0.1","port":9001},"ui":{"enabled":false}}}\n' > firebase.json
      - name: Install Firebase emulator and no-billing rules test SDK
        run: |
          npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@latest
      - name: Verify friend-only privacy and profile validity in emulator
        run: npx firebase emulators:exec --project demo-wordquest-friends --only database "node scripts/test-friend-profiles-180.mjs"
