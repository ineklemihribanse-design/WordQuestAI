name: Publish verified WordQuest AI 1.0.136 Arena engine bootstrap and native recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v136-engine-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wordquest-public-release
  cancel-in-progress: false
env:
  WQ_VERSION: '1.0.136'
  WQ_BASE_VERSION: '1.0.134'
  WQ_TARGET_CODE: '157'
  WQ_BASE_CODE: '156'
  WQ_BASE_SHA: 'f3e361a2d28a7f08447cf3919918dfb3cbd70fa444dd33ab57fc8649ea76e803'
  WQ_SOURCE_SHA: '7c71aa02a17fd2e2d18e7cc988403bafeb620960'
  WQ_NOTES: 'Arena motoru: ağ gerektirmeyen yerel WebView başlatma, WebView başarısız olduğunda aynı seçili seviyelerle yerel Android oyun üretimi; ortak oda verisinin doğrulaması ve mevcut Firebase kuralları korunur.'
  WQ_QA_RUN: '45647289229'
jobs:
  upgrade:
    if: github.repository == 'ineklemihribanse-design/WordQuestAI'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify completed QA and Android upgrade proof without rerunning build or emulator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 45647289229 45647289456 45647289637; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" | jq -e --arg sha "$WQ_SOURCE_SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$sha'
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45647423613" | jq -e '.head_sha=="8b6a537bea624fff7cab10081e7ba15fe0ba5527"'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45647423613/jobs?per_page=100" | jq -e '.jobs | any(.id==139322070943 and .name=="upgrade" and .conclusion=="success" and (.steps|any(.name=="Reconstruct installed APK and verify Android upgrade without uninstall" and .conclusion=="success")))'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15038369193" | jq -e '.name=="WordQuestAI-v1.0.136-verified-release" and .expired==false and .digest=="sha256:efd875616a50ae089f3acbcf4615ca34bb48bb851f30649f5766ce67bdccfb3f"'
          echo 'PASS: previous Android upgrade and gameplay tests are valid; reuse exact artifact.'
  publish:
    needs: upgrade
    if: needs.upgrade.result == 'success'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WordQuestAI-v1.0.136-verified-release
          run-id: 45647423613
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified
      - name: Validate final signed bytes, draft, upload and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/verified"
          export D
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          d=Path(os.environ['D']); out=d/'dist'; m=json.loads((out/'update.json').read_text()); p=m['deltas'][0]
          def sha(f):
              with f.open('rb') as s:return hashlib.file_digest(s,'sha256').hexdigest()
          assert m['versionName']==os.environ['WQ_VERSION'] and m['versionCode']==int(os.environ['WQ_TARGET_CODE'])
          assert p['fromVersionCode']==int(os.environ['WQ_BASE_CODE']) and p['baseSha256']==os.environ['WQ_BASE_SHA']
          assert sha(out/'WordQuestAI.apk')==m['sha256']==p['targetSha256']==(d/'upgrade-proof.sha256').read_text().split()[0]
          assert sha(out/p['file'])==p['sha256'] and (out/p['file']).stat().st_size==p['sizeBytes']
          assert {f.name for f in out.iterdir()}=={'WordQuestAI.apk','update.json',p['file']}
          PY
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          TAG="v$WQ_VERSION"
          if [ "$latest" != "$TAG" ] && [ "$latest" != "v$WQ_BASE_VERSION" ]; then
            echo "::error::Production base changed; refusing outdated publication"
            exit 1
          fi
          # Create draft separately from large asset uploads; recover transient 502s.
          ID=""
          for attempt in $(seq 1 5); do
            ID=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId 2>/dev/null || true)
            if [ -n "$ID" ]; then break; fi
            test "$latest" = "v$WQ_BASE_VERSION"
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$WQ_SOURCE_SHA" --draft --title "WordQuest AI $WQ_VERSION" --notes "$WQ_NOTES" || true
            sleep 5
          done
          ID=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" > "$D/uploaded.json"
          jq -e --arg sha "$WQ_SOURCE_SHA" --arg tag "$TAG" '.target_commitish==$sha and .tag_name==$tag and .prerelease==false' "$D/uploaded.json"
          for file in "$D/dist/"*; do
            name=$(basename "$file")
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            size=$(stat -c '%s' "$file")
            for attempt in $(seq 1 4); do
              gh api "repos/$GITHUB_REPOSITORY/releases/$ID" > "$D/uploaded.json"
              if jq -e --arg n "$name" --arg d "$digest" --argjson z "$size" '.assets|any(.name==$n and .state=="uploaded" and .digest==$d and .size==$z)' "$D/uploaded.json" >/dev/null; then break; fi
              jq -e '.draft==true' "$D/uploaded.json"
              # Never overwrite a pre-existing asset or publish an unverified draft.
              jq -e --arg n "$name" 'all(.assets[]; .name!=$n)' "$D/uploaded.json"
              gh release upload "$TAG" "$file" -R "$GITHUB_REPOSITORY" || true
              sleep 4
            done
            gh api "repos/$GITHUB_REPOSITORY/releases/$ID" > "$D/uploaded.json"
            jq -e --arg n "$name" --arg d "$digest" --argjson z "$size" '.assets|any(.name==$n and .state=="uploaded" and .digest==$d and .size==$z)' "$D/uploaded.json"
          done
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          d=Path(os.environ['D']);r=json.loads((d/'uploaded.json').read_text())
          assert r['tag_name']=='v'+os.environ['WQ_VERSION'] and not r['prerelease']
          assert r['target_commitish']==os.environ['WQ_SOURCE_SHA']
          files={f.name:f for f in (d/'dist').iterdir()}
          assert len(r['assets'])==3 and set(files)=={a['name'] for a in r['assets']}
          for a in r['assets']:
              f=files[a['name']]
              with f.open('rb') as s: digest=hashlib.file_digest(s,'sha256').hexdigest()
              assert a['state']=='uploaded' and a['size']==f.stat().st_size and a['digest']=='sha256:'+digest
          print('PASS: uploaded assets equal emulator-tested bytes')
          PY
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .draft)" = true ]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v$WQ_BASE_VERSION"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true --jq '{tag:.tag_name,draft:.draft}'
          fi
          # GitHub's latest endpoint can lag a newly published release.
          for attempt in $(seq 1 18); do
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG" ]; then
              echo "PASS: $TAG is live on installed-app update channel"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Release latest endpoint did not confirm within bounded retries"
          exit 1


  content:
    needs: publish
    if: needs.publish.result == 'success'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORE_TAG: v1.0.136
      CORE_CODE: '157'
      CONTENT_VERSION: '1.0.137'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 7c71aa02a17fd2e2d18e7cc988403bafeb620960
          path: verified-source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: WordQuestAI-v1.0.136-verified-release
          run-id: 45647423613
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-content
      - name: Assemble and validate cumulative signed web and design content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$CORE_TAG"
          mkdir -p "$RUNNER_TEMP/content-base" "$RUNNER_TEMP/content-out/objects"
          gh release download "$CORE_TAG" -R "$GITHUB_REPOSITORY" -p WordQuestAI.apk -p update.json -D "$RUNNER_TEMP/content-base"
          CORE_SHA="$(cut -d" " -f1 "$RUNNER_TEMP/verified-content/upgrade-proof.sha256")"
          export CORE_SHA
          echo "$CORE_SHA  $RUNNER_TEMP/content-base/WordQuestAI.apk" | sha256sum -c -
          python3 - <<'PY'
          import hashlib,json,os,sys,zipfile
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          src=Path('verified-source')
          sys.path.insert(0,str(src/'tools/content_updates'))
          from web_bundle import validate as validate_web
          from lobby_design import validate as validate_design
          from engine_bundle import validate as validate_engine
          out=base/'content-out'
          m=json.loads((base/'content-base/update.json').read_text())
          assert m['versionCode']==int(os.environ['CORE_CODE']) and m['sha256']==os.environ['CORE_SHA']
          files={'web/arena_lobby.html':((src/'tools/v130_web/content131/web/arena_lobby.html').read_bytes(),validate_web),
                 'design/arena_lobby.json':((src/'tools/v128_lobby/content129/design/arena_lobby.json').read_bytes(),validate_design)}
          entries=[]
          with zipfile.ZipFile(base/'content-base/WordQuestAI.apk') as z:
              files['web/arena_engine.html']=(z.read('assets/web/arena_engine.html'),validate_engine)
              for name,(data,validator) in sorted(files.items()):
                  validator(data)
                  if name!='web/arena_engine.html': assert z.read('assets/'+name)!=data,name
                  h=hashlib.sha256(data).hexdigest()
                  (out/'objects'/(h+Path(name).suffix)).write_bytes(data)
                  entries.append(dict(path=name,sha256=h,size=len(data)))
          payload=dict(schema=1,packageName=m['packageName'],coreCode=m['versionCode'],version=os.environ['CONTENT_VERSION'],sequence=1,files=entries)
          (base/'content-payload.json').write_bytes(json.dumps(payload,separators=(',',':'),sort_keys=True).encode())
          print('PASS: cumulative signed lobby, design and tested engine baseline;',sum(e['size'] for e in entries),'bytes')
          PY
      - name: Sign manifest using existing APK signing certificate
        env:
          WQ_RELEASE_KEYSTORE_B64: ${{ secrets.WQ_RELEASE_KEYSTORE_B64 }}
          WQ_STORE_PASS: ${{ secrets.WQ_UPGRADE_STORE_PASSWORD }}
          WQ_KEY_ALIAS: ${{ secrets.WQ_UPGRADE_KEY_ALIAS }}
          WQ_KEY_PASS: ${{ secrets.WQ_UPGRADE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$WQ_RELEASE_KEYSTORE_B64" && test -n "$WQ_STORE_PASS" && test -n "$WQ_KEY_ALIAS" && test -n "$WQ_KEY_PASS"
          umask 077
          key="$RUNNER_TEMP/content-signing.p12"
          trap 'rm -f "$key"' EXIT
          printf %s "$WQ_RELEASE_KEYSTORE_B64" | base64 -d > "$key"
          java tools/content_channel/SignContent.java "$key" "$RUNNER_TEMP/content-payload.json" "$RUNNER_TEMP/content-out/index.json"
      - name: Publish immutable content files and manifest after verified Android publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$CORE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin refs/heads/content-channel:refs/remotes/origin/content-channel
          git switch --detach refs/remotes/origin/content-channel
          python3 - <<'PY'
          import base64,hashlib,json,os,shutil
          from pathlib import Path
          here=Path('.')
          out=Path(os.environ['RUNNER_TEMP'])/'content-out'
          old=json.loads(base64.b64decode(json.loads((here/'index.json').read_text())['payload']))
          new=json.loads(base64.b64decode(json.loads((out/'index.json').read_text())['payload']))
          assert new['coreCode']==157 and new['version']=='1.0.137' and new['schema']==1
          if old!=new:
              assert old['coreCode']==156 and old['version']=='1.0.135','Unexpected content channel'
              for obj in (out/'objects').iterdir():
                  assert obj.suffix in ('.html','.json')
                  assert obj.name==hashlib.sha256(obj.read_bytes()).hexdigest()+obj.suffix
                  dest=here/'objects'/obj.name
                  if dest.exists(): assert dest.read_bytes()==obj.read_bytes()
                  else: shutil.copyfile(obj,dest)
              shutil.copyfile(out/'index.json',here/'index.json')
          PY
          git add -- index.json objects
          if ! git diff --cached --quiet; then
            git commit -m "Signed hybrid web and design content 1.0.137 for core 157"
            git push origin HEAD:refs/heads/content-channel
          fi
          echo "Content 1.0.137 published for Android core 157; no APK installation." >> "$GITHUB_STEP_SUMMARY"
