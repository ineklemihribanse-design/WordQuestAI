name: Verify Arena private 2D mascot preview rules (no deployment)
on:
  push:
    branches: [feature/v183-quality-stability]
    paths:
      - 'firebase/database.rules.v183.json'
      - 'tools/v183/verify_arena_share_rules_183.py'
      - 'scripts/test-arena-mascot-183.mjs'
      - '.github/workflows/verify-arena-mascot-183.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Verify additive private-room-only rules
        run: |
          python3 -m json.tool firebase/database.rules.v183.json >/dev/null
          python3 tools/v183/verify_arena_share_rules_183.py
          printf '{"database":{"rules":"firebase/database.rules.v183.json"},"emulators":{"database":{"host":"127.0.0.1","port":9005},"ui":{"enabled":false}}}\n' > firebase.json
      - name: Install isolated Firebase emulator tester
        run: npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@latest
      - name: Test both devices, strangers and opt-in removal
        run: npx firebase emulators:exec --project demo-wordquest-maskot-v183 --only database "node scripts/test-arena-mascot-183.mjs"
