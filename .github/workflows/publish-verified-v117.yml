name: Publish exact verified v1.0.117 delta release
on:
  push:
    branches: [release/v117-verified-delta]
    paths: ['.github/workflows/publish-verified-v117.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: wordquest-v117-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/release/v117-verified-delta'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify draft assets, exact signed base, and successful upgrade proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/v117-publication"
          mkdir -p "$D"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v1.0.115
          for run in 45505132566 45506452108 45507286148; do
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .conclusion)" = success
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/457442312" > "$D/release.json"
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/789219762" > "$D/update.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14972382076/zip" > "$D/base.zip"
          echo "01aa6a26e9c9d81e6875927eea30411870a689efadc000fb9497bdc17de2c4d3  $D/base.zip" | sha256sum -c -
          echo "a05f9ae3b6f91b0850ff0a73036f69bbaf5612b49fc14dc52f35dcfb63a981a6  $D/update.json" | sha256sum -c -
          python3 - "$D" "$GITHUB_REPOSITORY" <<'PY'
          import sys,json,zipfile,hashlib,io
          from pathlib import Path
          d=Path(sys.argv[1]); r=json.loads((d/'release.json').read_text()); m=json.loads((d/'update.json').read_text())
          assert r['draft'] and not r['prerelease'] and r['tag_name']=='v1.0.117'
          assert r['target_commitish']=='6826416646e1900d06537465877bf7fbb722aa2c'
          expected={'WordQuestAI.apk':(266872647,'9e6dc7c218fda8728560c81bbffe6f238174ac6849176ebb9597f7e111452451'),'WordQuestAI-142-to-143.wqd.gz':(64057859,'29dce2eb2488f909fd62c9401354524ff58f661a479166fdf5b598a6482f6822'),'update.json':(1038,'a05f9ae3b6f91b0850ff0a73036f69bbaf5612b49fc14dc52f35dcfb63a981a6')}
          assert len(r['assets'])==3
          for a in r['assets']:
              size,sha=expected[a['name']]
              assert a['state']=='uploaded' and a['size']==size and a['digest']=='sha256:'+sha
          assert m['versionCode']==143 and m['versionName']=='1.0.117' and m['packageName']=='com.kelimebulmacasi.a1.practice.fresh'
          assert m['sizeBytes']==expected['WordQuestAI.apk'][0] and m['sha256']==expected['WordQuestAI.apk'][1]
          p=m['deltas'][0];assert len(m['deltas'])==1 and p['fromVersionCode']==142 and p['toVersionCode']==143
          assert p['targetSha256']==m['sha256'] and p['targetSizeBytes']==m['sizeBytes']
          assert p['sizeBytes']==expected[p['file']][0] and p['sha256']==expected[p['file']][1]
          with zipfile.ZipFile(d/'base.zip') as z:
              n=[x for x in z.namelist() if x.endswith('WordQuestAI-v1.0.116-signed-qa.apk')]
              assert len(n)==1
              b=z.read(n[0]);assert len(b)==p['baseSizeBytes'] and hashlib.sha256(b).hexdigest()==p['baseSha256']
          with zipfile.ZipFile(io.BytesIO(b)) as z:
              endpoint=('https://api.github.com/repos/'+sys.argv[2]+'/releases/latest').encode()
              assert any(endpoint in z.read(n) for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')), 'Installed base update endpoint mismatch'
          print('PASS: exact v116 base, draft asset integrity, compiled updater endpoint and emulator upgrade evidence')
          PY
      - name: Publish only the verified draft as latest without changing any asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v1.0.115
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/457442312" --jq .draft)" = true
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/457442312" -F draft=false -f make_latest=true --jq '{tag:.tag_name,draft:.draft,prerelease:.prerelease}'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v1.0.117
          echo 'PASS: 1.0.117 is latest; exact 64 MB delta available from 1.0.116.'
