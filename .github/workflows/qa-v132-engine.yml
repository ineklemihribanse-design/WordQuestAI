          python3 tools/v132_engine/apply_settings.py
          node --test tools/v132_engine/engine.test.mjs
          node tools/v132_engine/build_engine.mjs tools/v132_engine/arena_engine.html
          node tools/v132_engine/smoke_bundle.mjs tools/v132_engine/arena_engine.html source/app/src/main/assets/arena-vocabulary-v1.json
          node tools/v132_engine/test_transport.mjs tools/v132_engine/arena_engine.html source/app/src/main/assets/arena-vocabulary-v1.json
          python3 tools/v132_engine/apply_engine.py
          python3 tools/v132_engine/apply_online.py
          python3 tools/v132_engine/apply_video_layout.py
          python3 tools/full_source_audit/apply_confirmed_fixes.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("source/app/build.gradle.kts")
          s=p.read_text()
          assert s.count("versionCode = 149")==1 and s.count('versionName = "1.0.123"')==1
          p.write_text(s.replace("versionCode = 149","versionCode = 161").replace('versionName = "1.0.123"','versionName = "1.0.144"'))
          PY
      - name: Verify Android SDK and Gradle
        run: |
          set -euo pipefail
          if ! test -s "$ANDROID_HOME/platforms/android-35/android.jar" ||
             ! test -s "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"; then
            SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
            "$SDKM" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore verified Robolectric runtime SDK cache
        id: robolectric_sdk_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wq-robolectric-i7
          key: wq-robolectric-sdk-i7-android14-15-v1
      - name: Prefetch and validate both required Robolectric SDKs
        timeout-minutes: 18
        run: |
          set -euo pipefail
          bash -n tools/v206/prefetch_robolectric_206.sh
          bash tools/v206/prefetch_robolectric_206.sh "$RUNNER_TEMP/wq-robolectric-i7"
      - name: Save verified Robolectric SDK cache
        if: steps.robolectric_sdk_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/wq-robolectric-i7
          key: wq-robolectric-sdk-i7-android14-15-v1
      - name: Run complete offline tests and build experimental unsigned APK in one Gradle invocation
        timeout-minutes: 28
        working-directory: source
        env:
          WQ_ROBOLECTRIC_DIR: ${{ runner.temp }}/wq-robolectric-i7
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Robolectric runtime downloads are independent of Gradle dependency caching.
          # Use only the verified local SDK files; keep every unit test enabled.
          INIT="$RUNNER_TEMP/wq206-robolectric.init.gradle"
          cat > "$INIT" <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                  systemProperty 'robolectric.offline', 'true'
                  systemProperty 'robolectric.dependency.dir', System.getenv('WQ_ROBOLECTRIC_DIR')
              }
          }
          GRADLE
          LOG="$RUNNER_TEMP/wq-v206-gradle.log"
          # First use already verified cached dependencies; don't hit Central unnecessarily.
          # Only retry a demonstrably network/cache-related failure, never a compilation or test failure.
          run_build() {
            local label="$1"; shift
            if ./gradlew --no-daemon --build-cache -I "$INIT" "$@" :app:testOfflineUnitTest :app:assembleOffline --stacktrace > "$LOG" 2>&1; then
              tail -n 70 "$LOG"
              return 0
            fi
            cp "$LOG" "$RUNNER_TEMP/wq-delta-${label}.log"
            echo "::group::${label} diagnostics"
            grep -nE '(^e:|^w:|Could not (GET|resolve|find)|No cached version|429|503|502|timed out|FAILURE)' "$LOG" | head -n 100 || true
            tail -n 70 "$LOG"
            echo "::endgroup::"
            return 1
          }
          if run_build cached --offline; then
            echo 'PASS: cached offline build'
          else
            if ! grep -Eiq 'No cached version|not available for offline mode|not available in offline mode|no cached resource|offline mode' "$LOG"; then
              echo "::error::Offline build failed for a non-cache reason; not retrying."
              exit 1
            fi
            if run_build central; then
              echo 'PASS: normal Maven Central build'
            else
              if ! grep -Eiq 'status code (429|502|503|504)|Too Many Requests|Read timed out|Connection reset' "$LOG"; then
                echo "::error::Non-transient Gradle failure; not retrying."
                exit 1
              fi
              echo "::warning::Maven Central request failed; switch to its alternate HTTPS endpoint."
              run_build central-alternate -I "$GITHUB_WORKSPACE/tools/delta_android/maven_central_alternate.init.gradle"
            fi
          fi
          test -s app/build/outputs/apk/offline/app-offline-unsigned.apk
          test -s app/build/outputs/apk/offline/output-metadata.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("app/build/outputs/apk/offline/output-metadata.json").read_text("utf-8"))
          assert d["applicationId"]=="com.kelimebulmacasi.a1.practice.fresh"
          assert (d["elements"][0]["versionCode"],d["elements"][0]["versionName"])==(161,"1.0.144")
          reports=list(Path("app/build/test-results/testOfflineUnitTest").glob("TEST-*.xml"))
          assert reports
          from xml.etree import ElementTree as ET
          delta=[p for p in reports if p.name.endswith(".WqDeltaMetadataTest.xml")]
          assert len(delta)==1, "New updater tests must actually run"
          report=ET.parse(delta[0]).getroot()
          assert int(report.get("tests","0"))>0 and int(report.get("failures","0"))==0 and int(report.get("errors","0"))==0 and int(report.get("skipped","0"))==0
          smart=[p for p in reports if p.name.endswith(".Wq117LenaMotionTest.xml")]
          assert len(smart)==1, "Smart Lena tests must run"
          sr=ET.parse(smart[0]).getroot()
          assert int(sr.get("tests","0"))>=2 and int(sr.get("failures","0"))==0 and int(sr.get("errors","0"))==0 and int(sr.get("skipped","0"))==0
          smooth=[p for p in reports if p.name.endswith(".Wq118LenaBlendTest.xml")]
          assert len(smooth)==1, "Native transition tests must run"
          br=ET.parse(smooth[0]).getroot()
          assert int(br.get("tests","0"))>=4 and int(br.get("failures","0"))==0 and int(br.get("errors","0"))==0 and int(br.get("skipped","0"))==0
          face=[p for p in reports if p.name.endswith(".Wq119LenaFaceTest.xml")]
          assert len(face)==1, "Face controller tests must run"
          fr=ET.parse(face[0]).getroot()
          assert int(fr.get("tests","0"))>=3 and int(fr.get("failures","0"))==0 and int(fr.get("errors","0"))==0 and int(fr.get("skipped","0"))==0
          print("PASS: all offline unit tests, semantic Lena, native crossfade and independent face controller.")
          PY
      - name: Preserve complete Gradle log on failed compilation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WordQuestAI-v206-full-Gradle-error-log
          path: |
            ${{ runner.temp }}/wq-v206-gradle.log
            ${{ runner.temp }}/wq-delta-*.log
          if-no-files-found: ignore
      - name: Print exact failing JVM tests, if any
        if: failure()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          base=Path("source/app/build/test-results/testOfflineUnitTest")
          found=False
          for path in sorted(base.glob("TEST-*.xml")):
              try:
                  root=ElementTree.parse(path).getroot()
              except Exception as exc:
                  print("Cannot read",path,exc)
                  continue
              for case in root.iter("testcase"):
                  for bad in ("failure","error"):
                      for node in case.findall(bad):
                          found=True
                          print("FAILED TEST:",path.name,case.get("classname"),case.get("name"))
                          print("WHY:",node.get("message",""))
                          print((node.text or "")[:2500])
          print("Failed test found:",found)
          PY
      - name: Sign v1.0.144 with current installed-app production certificate
        env:
          WQ_RELEASE_KEYSTORE_B64: ${{ secrets.WQ_RELEASE_KEYSTORE_B64 }}
          WQ_STORE_PASS: ${{ secrets.WQ_UPGRADE_STORE_PASSWORD }}
          WQ_KEY_ALIAS: ${{ secrets.WQ_UPGRADE_KEY_ALIAS }}
          WQ_KEY_PASS: ${{ secrets.WQ_UPGRADE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$WQ_RELEASE_KEYSTORE_B64" && test -n "$WQ_STORE_PASS"
          test -n "$WQ_KEY_ALIAS" && test -n "$WQ_KEY_PASS"
          umask 077
          KEY="$RUNNER_TEMP/wq-v206-signing.p12"
          trap 'rm -f "$RUNNER_TEMP/wq-v206-signing.p12"' EXIT
          printf %s "$WQ_RELEASE_KEYSTORE_B64" | base64 -d > "$KEY"
          OUT=source/app/build/outputs/apk/offline
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          java -jar "$SIGNER" sign             --ks "$KEY" --ks-type PKCS12 --ks-key-alias "$WQ_KEY_ALIAS"             --ks-pass env:WQ_STORE_PASS --key-pass env:WQ_KEY_PASS             --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true             --out "$OUT/WordQuestAI-v1.0.144-signed-qa.apk" "$OUT/app-offline-unsigned.apk"
          java -jar "$SIGNER" verify --verbose --print-certs "$OUT/WordQuestAI-v1.0.144-signed-qa.apk" > "$RUNNER_TEMP/wq-v206-signature.txt"
          grep -Fiq 'Signer #1 certificate SHA-256 digest: 29f9449cef86e511bb8256ca1db58580ff88dd1badd034ff79b81c6df662bce6' "$RUNNER_TEMP/wq-v206-signature.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/wq-v206-signature.txt"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/wq-v206-signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT/WordQuestAI-v1.0.144-signed-qa.apk" > "$RUNNER_TEMP/wq-v206-badging.txt"
          grep -m1 "^package:" "$RUNNER_TEMP/wq-v206-badging.txt"
          grep -Fq "name='com.kelimebulmacasi.a1.practice.fresh'" "$RUNNER_TEMP/wq-v206-badging.txt"
          grep -Fq "versionCode='161'" "$RUNNER_TEMP/wq-v206-badging.txt"
          grep -Fq "versionName='1.0.144'" "$RUNNER_TEMP/wq-v206-badging.txt"
          if grep -Fq 'application-debuggable' "$RUNNER_TEMP/wq-v206-badging.txt"; then exit 1; fi
          unzip -tq "$OUT/WordQuestAI-v1.0.144-signed-qa.apk"
          python3 - "$OUT/WordQuestAI-v1.0.144-signed-qa.apk" <<'PY'
          import json,sys,zipfile
          from pathlib import Path
          base=Path("source/app/src/main/assets/pronunciation")
          with zipfile.ZipFile(sys.argv[1]) as apk:
              prefix="assets/pronunciation/"
              for name in ("manifest.json","ipa.json"):
                  assert apk.read(prefix+name)==(base/name).read_bytes()
              words=json.loads(apk.read(prefix+"manifest.json"))["words"]
              names=set(apk.namelist())
              assert all(prefix+r+"/"+f+".ogg" in names for f in words.values() for r in ("en-us","en-gb"))
              arena=Path("source/app/src/main/assets/arena_v120")
              for art in arena.glob("*.webp"):
                  assert apk.read("assets/arena_v120/"+art.name)==art.read_bytes(),art.name
              assert len(list(arena.glob("*.webp")))==21
              print("PASS signed APK includes all 21 exact Arena graphics")
              settings=Path("source/app/src/main/assets/arena_v122")
              for art in settings.glob("*.webp"):
                  assert apk.read("assets/arena_v122/"+art.name)==art.read_bytes(),art.name
              assert len(list(settings.glob("*.webp")))==20
              print("PASS signed APK includes all 20 exact match settings graphics")
              print("PASS signed APK includes both recordings and IPA index for",len(words),"words")
          PY
          echo 'PASS: verified installed-app identity and same v2/v3 production signer.'
      - name: Preserve unsigned candidate for signing failure only
        if: failure() && hashFiles('source/app/build/outputs/apk/offline/app-offline-unsigned.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: WordQuestAI-v1.0.144-unsigned-QA
          path: source/app/build/outputs/apk/offline/app-offline-unsigned.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - name: Preserve signing diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WordQuestAI-v1.0.144-signature-diagnostics
          path: |
            ${{ runner.temp }}/wq-v206-signature.txt
            ${{ runner.temp }}/wq-v206-badging.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve signed content updater candidate for separate device testing
        uses: actions/upload-artifact@v4
        with:
          name: WordQuestAI-v1.0.144-signed-hybrid-engine-QA
          path: source/app/build/outputs/apk/offline/WordQuestAI-v1.0.144-signed-qa.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Report pipeline timing and cache reuse
        if: always()
        env:
          SOURCE_CACHE_HIT: ${{ steps.source_checkpoint.outputs.cache-hit }}
          AUDIO_CACHE_HIT: ${{ steps.audio_cache.outputs.cache-hit }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          start_file="$RUNNER_TEMP/wq-pipeline-start"
          if [ -f "$start_file" ]; then elapsed=$(( $(date +%s) - $(cat "$start_file") )); else elapsed=0; fi
          {
            echo '### WordQuest AI build efficiency'
            echo "- Result: $JOB_RESULT"
            echo "- Elapsed pipeline: ${elapsed}s (excluding initial runner setup)"
            echo "- Exact assembled source reused: ${SOURCE_CACHE_HIT:-false}"
            if [ "$SOURCE_CACHE_HIT" = true ]; then
              echo '- Pronunciation assets reused inside verified source snapshot; generation skipped.'
            else
              echo "- Exact pronunciation snapshot reused: ${AUDIO_CACHE_HIT:-false}"
            fi
            echo '- All final compilation, lint/test and signature gates remain unchanged for their respective workflows.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
