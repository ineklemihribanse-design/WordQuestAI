          bash tools/v206/run_bounded_emulator_qa_206.sh "$RUNNER_TEMP/wq206-emulator-upgrade.sh" source/app/build/outputs/apk/offline/WordQuestAI-v1.0.106-signed-qa.apk
          sha256sum --check "$RUNNER_TEMP/wq206-upgrade-passed.sha256"

