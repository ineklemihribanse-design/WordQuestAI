      - name: Publish immutable v1.0.106 to installed app update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$WQ_OLD_TAG"
          if gh release view v1.0.106 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::Existing v1.0.106 release; refusing overwrite.' >&2
            exit 1
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/fix/v190-tablet-board-and-visible-icons" --jq .object.sha)" = "$GITHUB_SHA"
          sha256sum --check "$RUNNER_TEMP/wq206-upgrade-passed.sha256"
          mkdir -p dist
          cp source/app/build/outputs/apk/offline/WordQuestAI-v1.0.106-signed-qa.apk dist/WordQuestAI.apk
          python3 - <<'PY'
          import hashlib,json,pathlib
          apk=pathlib.Path("dist/WordQuestAI.apk")
          assert apk.stat().st_size > 100_000_000
          payload={
            "schemaVersion":1,
            "tag":"v1.0.106",
            "versionCode":132,
            "versionName":"1.0.106",
            "packageName":"com.kelimebulmacasi.a1.practice.fresh",
            "apkFile":"WordQuestAI.apk",
            "sizeBytes":apk.stat().st_size,
            "sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
            "notes":"Kisa kelimelerde cihaz motorunun harf harf okumasi engellenir. US DO HI MY gibi cevaplarin secilen aksana ait dogrulanmis kaydi kullanilir. Ses ve IPA karsilastirmasi, tam kelime kapsami ve mevcut oyun tasarimi korunur."
          }
          pathlib.Path("dist/update.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          gh release create v1.0.106 dist/WordQuestAI.apk dist/update.json \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title 'WordQuest AI 1.0.106 — Doğru Kısa Kelime Seslendirmesi' \
            --notes 'US, DO, HI, MY gibi kısa bulmaca cevapları için doğrulanmış çevrimdışı kayıt doğrudan kullanılır. Diğer kelimelerde seçilen cihaz sesi korunur. İki aksanın ses dalgası ve IPA denetimi, tam arşiv ve yerinde güncelleme testleri zorunlu. Fiziksel cihazda dinleme ayrıca gereklidir.'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v1.0.106
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.106" --jq '[.assets[].name] | sort | join(",")')" = 'WordQuestAI.apk,update.json'
          echo 'PASS: v1.0.106 published for Settings > Updates.'
