      - name: Prepare actual published version to v1.0.106 in-place upgrade QA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          tmp=Path(os.environ["RUNNER_TEMP"])
          old_tag=os.environ["WQ_OLD_TAG"]
          old_code=os.environ["WQ_OLD_CODE"]
          old_hash=os.environ["WQ_OLD_SHA256"]
          src=Path("tools/v190/qa_emulator_upgrade_190.sh").read_text("utf-8")
          edits=(
            ("releases/download/v1.0.89/",f"releases/download/{old_tag}/"),
            ("WordQuestAI-v1.0.90-signed-qa.apk","WordQuestAI-v1.0.106-signed-qa.apk"),
            ("versionCode='116'","versionCode='132'"),
            ("versionCode='115'",f"versionCode='{old_code}'"),
            ("versionCode=116","versionCode=132"),
            ("python3 tools/v190/verify_upgrade_metadata_190.py",'python3 "$RUNNER_TEMP/wq206-verify-upgrade.py"'),
            ('test -s "$OLD"','test -s "$OLD"\nprintf "%s  %s\\n" "$WQ_OLD_SHA256" "$OLD" | sha256sum --check'),
          )
          for old,new in edits:
              assert old in src,old
              src=src.replace(old,new)
          src=src.replace("v1.0.89",old_tag).replace("v1.0.90","v1.0.106")
          (tmp/"wq206-emulator-upgrade.sh").write_text(src,"utf-8")
          verify=Path("tools/v190/verify_upgrade_metadata_190.py").read_text("utf-8")
          assert 'old["version"] != 115 or new["version"] != 116' in verify
          verify=verify.replace('old["version"] != 115 or new["version"] != 116',
                                f'old["version"] != {old_code} or new["version"] != 132')
          verify=verify.replace('Expected in-place code 115 -> 116',
                                f'Expected in-place code {old_code} -> 132')
          verify=verify.replace("v1.0.89",old_tag).replace("v1.0.90","v1.0.106")
          (tmp/"wq206-verify-upgrade.py").write_text(verify,"utf-8")
          print("PASS: staged signed",old_tag,"-> v1.0.106 upgrade test")
          PY
      - name: Enable KVM for production upgrade QA
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; else echo "::warning::KVM unavailable"; fi
      - name: Preserve signed candidate after successful build and tests
        uses: actions/upload-artifact@v4
