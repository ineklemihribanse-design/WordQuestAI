name: Reclaim old WordQuest AI Actions artifact storage
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prune-actions-artifacts.yml'
  workflow_dispatch:
  schedule:
    - cron: '45 2 * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: wordquest-artifact-storage-prune
  cancel-in-progress: false
jobs:
  prune-duplicate-test-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test cleanup safety before deleting anything
        run: python3 -m unittest discover -s tools/maintenance -p 'test_prune_actions_artifacts.py' -v
      - name: Remove old duplicate test artifacts, protect latest samples and main builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/maintenance/prune_actions_artifacts.py
