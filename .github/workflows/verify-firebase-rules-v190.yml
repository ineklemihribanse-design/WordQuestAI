name: Verify WordQuest 1.0.90 Firebase Rules before manual publishing
on:
  push:
    branches: [release/firebase-rules-v190-manual]
    paths:
      - 'firebase/database.rules.json'
      - 'scripts/test-firebase-rules-v190.mjs'
      - '.github/workflows/verify-firebase-rules-v190.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firebase-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify valid complete 1.0.90 Firebase JSON
        run: |
          set -euo pipefail
          python3 -m json.tool firebase/database.rules.json > /dev/null
          ! grep -Fq 'numChildren(' firebase/database.rules.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('firebase/database.rules.json').read_text())['rules']
          assert r['friendProfiles']['$uid']['avatarPreview']['.validate']
          assert r['premiumRooms']['$code']['package6']['settings']['.validate']
          print('PASS: JSON, Arena settings, and friend avatar security')
          PY
          printf '{"database":{"rules":"firebase/database.rules.json"},"emulators":{"database":{"host":"127.0.0.1","port":9000},"ui":{"enabled":false}}}\n' > firebase.json
      - name: Install Firebase local rules emulator
        run: |
          npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@latest
      - name: Validate RTDB compilation and permissions with emulator
        run: |
          npx firebase emulators:exec --project demo-wordquest-v190-rules --only database "node scripts/test-firebase-rules-v190.mjs"
