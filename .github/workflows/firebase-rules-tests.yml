name: Test WordQuest Firebase Room Quota Rules
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-firebase-room-rules.mjs'
      - 'v106-account-quota-share-overlay.b64'
      - '.github/workflows/firebase-rules-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract account quota rules
        run: |
          base64 -d v106-account-quota-share-overlay.b64 > /tmp/wq106.zip
          unzip -p /tmp/wq106.zip database.rules.json > database.rules.json
          python3 -m json.tool database.rules.json >/dev/null
          printf '{"database":{"rules":"database.rules.json"},"emulators":{"database":{"host":"127.0.0.1","port":9000},"ui":{"enabled":false}}}\n' > firebase.json
      - name: Install local no-billing Firebase emulator and test SDK
        run: |
          npm init -y
          npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@latest
      - name: Enforce quota and account permissions with RTDB emulator
        run: npx firebase emulators:exec --project demo-wordquest --only database "node scripts/test-firebase-room-rules.mjs"
