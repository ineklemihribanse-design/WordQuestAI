name: Verify Arena 1.0.78 Firebase lobby rules
on:
  push:
    branches: [feature/v175-comprehensive-learning-update]
    paths:
      - 'firebase/database.rules.json'
      - 'scripts/test-premium-lobby-rules-178.mjs'
      - '.github/workflows/test-arena-lobby-178.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare non-production Realtime Database emulator
        run: |
          set -euo pipefail
          python3 -m json.tool firebase/database.rules.json >/dev/null
          printf '{"database":{"rules":"firebase/database.rules.json"},"emulators":{"database":{"host":"127.0.0.1","port":9000},"ui":{"enabled":false}}}\n' > firebase.json
          npm init -y >/dev/null
          npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@latest
      - name: Confirm both-player ready, correct avatar and authorization in emulator
        run: npx firebase emulators:exec --project demo-wordquest --only database "node scripts/test-premium-lobby-rules-178.mjs"
