          script: bash tools/v188/qa_emulator_upgrade_188.sh
      - name: Publish v1.0.88 to installed app update channel only after all gates pass
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/v1.0.87-pakets1-7-integration' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v1.0.87
          if gh release view v1.0.88 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Immutable v1.0.88 release already exists. Refusing overwrite.' >&2
            exit 1
          fi
          mkdir -p dist
          cp source/app/build/outputs/apk/offline/WordQuestAI-v1.0.88-signed-qa.apk dist/WordQuestAI.apk
          python3 - <<'PY'
          import hashlib,json,pathlib
          apk=pathlib.Path('dist/WordQuestAI.apk')
          assert apk.stat().st_size>100_000_000
          payload={
           "schemaVersion":1,
           "tag":"v1.0.88",
           "versionCode":114,
           "versionName":"1.0.88",
           "packageName":"com.kelimebulmacasi.a1.practice.fresh",
           "apkFile":"WordQuestAI.apk",
           "sizeBytes":apk.stat().st_size,
           "sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
           "notes":"Paket 1-7 ve guvenli yazma/gercek ana sayfa ikonlari: Arena tahta/ipuclari/arkadas profili, kategori/fiil ikonlari, Kelime Hafizam, yeni oyun ve paragraf modlari, eslestirme, Lena ses/animasyon ve uygulama geneli bilgi ikonlari. Bulmaca yazarken klavye acildiginda tahta yenilenmez; ana sayfa, tek kisilik bulmaca, yeni oyun ve klasor ikonlari baglandi. Arkadas maskotu 320px'e kadar guvenli onizleme ile gosterilir. Eski kayitlar ve imza korunur. Canli Firebase guvenlik kurallari ayri yonetici islemi gerektirir."
          }
          pathlib.Path('dist/update.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          gh release create v1.0.88 dist/WordQuestAI.apk dist/update.json \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title 'WordQuest AI 1.0.88 — Paket 1–7 Birleşik Güncelleme' \
            --notes 'Paket 1-7 ve yazma/ikon/maskot düzeltmeleri, Android code114. Tam kaynak derlemesi/JVM testleri, aynı paket/sertifika ve mevcut v1.0.87 üzerine veri koruyan emülatör kurulum kontrolü başarıyla tamamlandı. Firebase canlı kurallarının yönetici tarafından ayrıca yayımlanması gerekebilir.'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v1.0.88
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.88" --jq '[.assets[].name] | sort | join(",")')" = 'WordQuestAI.apk,update.json'
          echo 'PASS: v1.0.88 is now visible in Settings > Updates.'

