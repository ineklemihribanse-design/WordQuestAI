name: Publish Arena 1.0.50 to in-app updater (manual, gated)

on:
  workflow_dispatch:
    inputs:
      firebase_rules_confirmed:
        description: 'Confirm production RTDB Arena V2 rules were deployed and tested: DEPLOYED_AND_TESTED'
        required: true
        type: string
      two_device_approved:
        description: 'Two-device host and guest ready/start/score test passed'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wordquest-arena-150-production-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.firebase_rules_confirmed == 'DEPLOYED_AND_TESTED' && inputs.two_device_approved == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact pre-tested immutable signed APK and check SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download arena-v1.0.50-preview -R "$GITHUB_REPOSITORY" \
            --pattern 'WordQuestAI-Arena-v1.0.50-preview.*' --dir dist
          test -s dist/WordQuestAI-Arena-v1.0.50-preview.apk
          test -s dist/WordQuestAI-Arena-v1.0.50-preview.sha256
          (cd dist && sha256sum -c WordQuestAI-Arena-v1.0.50-preview.sha256)
          cp dist/WordQuestAI-Arena-v1.0.50-preview.apk dist/WordQuestAI.apk

      - name: Verify app identity, upgrade version and 1.0.49 signing certificate
        run: |
          set -euo pipefail
          APK=dist/WordQuestAI.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$AAPT" && test -x "$SIGNER"
          "$AAPT" dump badging "$APK" | head -1 | tee /tmp/wq-arena150-package
          grep -Fq "name='com.kelimebulmacasi.a1.practice.fresh'" /tmp/wq-arena150-package
          grep -Fq "versionCode='75'" /tmp/wq-arena150-package
          grep -Fq "versionName='1.0.50-arena-v3-preview'" /tmp/wq-arena150-package
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/wq-arena150-sign
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/wq-arena150-sign
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/wq-arena150-sign
          grep -Fqi 'Signer #1 certificate SHA-256 digest: 29f9449cef86e511bb8256ca1db58580ff88dd1badd034ff79b81c6df662bce6' /tmp/wq-arena150-sign
          unzip -tq "$APK"

      - name: Generate v1.0.50 manifest expected by installed updater
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          apk=pathlib.Path("dist/WordQuestAI.apk")
          data={
              "schemaVersion":1,
              "tag":"v1.0.50",
              "versionCode":75,
              "versionName":"1.0.50-arena-v3-preview",
              "packageName":"com.kelimebulmacasi.a1.practice.fresh",
              "apkFile":"WordQuestAI.apk",
              "sizeBytes":apk.stat().st_size,
              "sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
              "notes":"Arena: yeni mobil giriş, lobi, profil avatarları, hazır olma, güncellenen yarışma kuralları, klavyeye duyarlı bulmaca.",
          }
          assert data["sizeBytes"]>90000000
          pathlib.Path("dist/update.json").write_text(
              json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          PY

      - name: Confirm newest normal update is 1.0.49 and publish exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$tag" = v1.0.49
          if gh release view v1.0.50 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.50 already published; refusing overwrite.' >&2
            exit 1
          fi
          gh release create v1.0.50 dist/WordQuestAI.apk dist/update.json \
            -R "$GITHUB_REPOSITORY" \
            --title 'WordQuest AI v1.0.50 — Arena V3' \
            --notes 'Modern açık renkli Arena odaları; hazır onayı, seviye düzenleme, iki turlu düello ve avatar hareketleri. Canlı Firebase izinleri iki cihazda doğrulanmış olmalıdır.' \
            --target main --latest
          gh release view v1.0.50 -R "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name] | sort | join(",")' | grep -Fxq 'WordQuestAI.apk,update.json'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v1.0.50
          echo "In-app updater can now find v1.0.50, signed code75."
