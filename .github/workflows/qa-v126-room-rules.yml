name: Test Arena custom mascot and atomic room rules
on:
  pull_request:
    branches: [fix/v190-tablet-board-and-visible-icons]
    paths: ['firebase/database.rules.v126.json','tools/v126_room/**','.github/workflows/qa-v126-room-rules.yml']
permissions:
  contents: read
jobs:
  test:
    if: github.head_ref == 'feature/v126-arena-room-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          printf '{"database":{"rules":"firebase/database.rules.v126.json"},"emulators":{"database":{"host":"127.0.0.1","port":9000},"ui":{"enabled":false}}}\n' > firebase.json
          npm init -y
          npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@6.0.0
          npx firebase emulators:exec --project demo-wordquest --only database "node tools/v126_room/test_rules.mjs"
