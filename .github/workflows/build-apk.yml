          from pathlib import Path
          file=Path("source/app/build.gradle.kts")
          text=file.read_text(encoding="utf-8")
          for old,new in [
              ('versionCode = 72', 'versionCode = 73'),
              ('versionName = "1.0.47-vocabulary-2p5d-compat"', 'versionName = "1.0.48-arena-preview"'),
          ]:
              assert text.count(old)==1, f"Version metadata mismatch: {old}"
