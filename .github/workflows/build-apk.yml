          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/signature-verification.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' dist/signature-verification.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: 29f9449cef86e511bb8256ca1db58580ff88dd1badd034ff79b81c6df662bce6' dist/signature-verification.txt
          cat > dist/release-notes.md <<'NOTES'
          WordQuest AI 1.0.61 (code 86)

          New Lena appearance: warm natural skin, blue hair, blue eyes and eyebrows, rose lips, blue outfit, navy trousers and light shoes. The original single-mesh white GLB had no materials; color was baked into a normalized RGBA8 vertex attribute and one PBR material without bulky textures.
          Real face mesh morphs: mouth opening during actual audio playback and soft periodic blinking. The previous 201-bone model had facial bones with zero skinning influence, so the original bone-only facial clips could not deform her face. The update adds two genuine glTF morph targets and two facial animation clips alongside existing body gestures.
