  workflow_dispatch:
  pull_request:
    branches: [main, fix/139-conversation-diagnostics-and-provider-errors]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDKM"
          "$SDKM" --list_installed | head -60
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Android dependencies and voice generator
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::Queue-Mode=access -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends espeak libsndfile1
          python3 -m pip install --retries 5 --timeout 60 soundfile
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKM" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract complete source (except generated audio)
        run: |
          test -s wq-noaudio.zip
          unzip -tq wq-noaudio.zip
          mkdir -p source
          unzip -q wq-noaudio.zip -d source
          test -s source/gradlew
      - name: Restore v0.8.1 source changes
        run: |
          test -s v081-patch.b64
          base64 -d v081-patch.b64 > /tmp/wordquest-081-patch.zip
          unzip -tq /tmp/wordquest-081-patch.zip
          unzip -oq /tmp/wordquest-081-patch.zip -d source
          grep -q 'versionName = "0.8.1"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline081"' source/app/build.gradle.kts
          test -s source/app/src/main/java/com/kelimebulmacasi/a1/DeviceAccentPlayer.kt
      - name: Apply UK-only locale speech compatibility fix
        run: |
          test -s v081-ukfix.patch.gz.b64
          base64 -d v081-ukfix.patch.gz.b64 | gzip -dc > /tmp/wordquest-uk-fix.patch
          echo "8e47ab59d4320d21dd197b7df8331e991c3060545617f0f8d253286cbacc35d8  /tmp/wordquest-uk-fix.patch" | sha256sum -c -
          cd source
          git apply --check /tmp/wordquest-uk-fix.patch
          git apply /tmp/wordquest-uk-fix.patch
          grep -q 'applicationIdSuffix = ".offline081uk"' app/build.gradle.kts
          grep -q SYSTEM_BRITISH_VOICE app/src/main/java/com/kelimebulmacasi/a1/DeviceAccentPlayer.kt
      - name: Apply v0.8.2 font scale and gentle sound update
        run: |
          test -s v082-features.patch.gz.b64
          base64 -d v082-features.patch.gz.b64 | gzip -dc > /tmp/wordquest-082.patch
          echo "5ef5fb42dbbd81e0619742c0a2afc817228a0749d4327631cb59b55fe04d7fae  /tmp/wordquest-082.patch" | sha256sum --check
          cd source
          git apply --check /tmp/wordquest-082.patch
          git apply /tmp/wordquest-082.patch
          python3 tools/make_soft_sound.py
          test -s app/src/main/res/raw/correct_soft.wav
          grep -q 'versionName = "0.8.2"' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline082"' app/build.gradle.kts
      - name: Restore all v0.9.0 features and version
        run: |
          test -s v090-delta.b64
          base64 -d v090-delta.b64 > /tmp/wq090.zip
          unzip -tq /tmp/wq090.zip
          unzip -oq /tmp/wq090.zip -d source
          grep -q 'versionName = "0.9.0"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline082"' source/app/build.gradle.kts
          grep -q 'signingConfig = null' source/app/build.gradle.kts
          test -s source/app/src/main/java/com/kelimebulmacasi/a1/PracticeHubScreen.kt
          test -s source/app/src/main/res/raw/correct_soft.wav
      - name: Apply v1.0 learning and YDS preview
        run: |
          test -s v100-source-overlay.b64
          base64 -d v100-source-overlay.b64 > /tmp/wordquest-v100-overlay.zip
          echo "16abbee32d3e6ead16bdfe4906990954d7403204f8fd761609455052e7e9f27c  /tmp/wordquest-v100-overlay.zip" | sha256sum --check
          unzip -tq /tmp/wordquest-v100-overlay.zip
          unzip -oq /tmp/wordquest-v100-overlay.zip -d source
          cd source
          git apply --check ../v100-compile-fix.patch
          git apply ../v100-compile-fix.patch
          git apply --check ../v100-yds-content-fix.patch
          git apply ../v100-yds-content-fix.patch
          cd ..
          grep -q 'versionName = "1.0.0-preview"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline082"' source/app/build.gradle.kts
          test -s source/app/src/main/java/com/kelimebulmacasi/a1/YdsCenterScreen.kt
          test -s source/app/src/main/java/com/kelimebulmacasi/a1/LearningDashboardScreen.kt
      - name: Apply complete Firebase arena and separate-install v1.0.1 configuration
        run: |
          test -s v101-standalone-overlay.b64
          base64 -d v101-standalone-overlay.b64 > /tmp/wordquest-101.zip
          echo "655bf8f2a7668117ec694430a6bd2b6df9470057b607b5282e12dfb86559ea1e  /tmp/wordquest-101.zip" | sha256sum --check
          unzip -tq /tmp/wordquest-101.zip
          unzip -oq /tmp/wordquest-101.zip -d source
          grep -q 'versionName = "1.0.1-firebase-standalone"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline101"' source/app/build.gradle.kts
          test -s source/app/src/main/java/com/kelimebulmacasi/a1/FirebaseLiveArena.kt
          test -s source/app/src/main/res/values/cloud_config.xml
          test -s source/app/src/test/java/com/kelimebulmacasi/a1/FirebaseLiveArenaTest.kt
      - name: Apply v1.0.2 all competition modes and optional server
        run: |
          test -s v102-firebase-modes-overlay-fixed.b64
          base64 -d v102-firebase-modes-overlay-fixed.b64 > /tmp/wordquest-102.zip
          echo "442e196954f660099b6cc59553b7663d8e009383e8c9bd86dc81a5ab4ddda1d9  /tmp/wordquest-102.zip" | sha256sum --check
          unzip -tq /tmp/wordquest-102.zip
          unzip -oq /tmp/wordquest-102.zip -d source
          grep -q 'versionName = "1.0.2-firebase-arena"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline101"' source/app/build.gradle.kts
          grep -q 'Google OAuth' source/app/src/main/java/com/kelimebulmacasi/a1/FirebaseLiveArena.kt
      - name: Configure Google OAuth and upgrade-compatible v1.0.3
        run: |
          cd source
          git apply --check ../v103-google-oauth.patch
          git apply ../v103-google-oauth.patch
          grep -q 'versionCode = 26' app/build.gradle.kts
          grep -q 'versionName = "1.0.3-google-oauth"' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline101"' app/build.gradle.kts
          grep -q '198875801515-cn2hcpeg16vs9vsq0de38tbf0ne8t5er.apps.googleusercontent.com' app/src/main/res/values/cloud_config.xml
      - name: Match Firebase registered Android client (offline101) for v1.0.4
        run: |
          cd source
          git apply --check ../v104-firebase-android-id.patch
          git apply ../v104-firebase-android-id.patch
          grep -q 'versionCode = 27' app/build.gradle.kts
          grep -q 'versionName = "1.0.4-firebase-identity"' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline101"' app/build.gradle.kts
          grep -q '1:198875801515:android:73562494e08141b79954ee' app/src/main/res/values/cloud_config.xml
      - name: Fix persistent Google-account sync using Firebase Realtime Database
        run: |
          test -s v105-realtime-sync-overlay.b64
          base64 -d v105-realtime-sync-overlay.b64 > /tmp/wordquest-105.zip
          echo "daa556d3b4c9e413014f4c0c7b01349d087bbd71ec7fb3e8d59f4f85f4c3473e  /tmp/wordquest-105.zip" | sha256sum --check
          unzip -tq /tmp/wordquest-105.zip
          unzip -oq /tmp/wordquest-105.zip -d source
          grep -q 'versionCode = 28' source/app/build.gradle.kts
          grep -q 'versionName = "1.0.5-realtime-sync"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline101"' source/app/build.gradle.kts
          grep -q 'FirebaseDatabase' source/app/src/main/java/com/kelimebulmacasi/a1/Accounts.kt
          test -s source/app/src/test/java/com/kelimebulmacasi/a1/CloudSyncKeyTest.kt
          python3 -m json.tool source/database.rules.json >/dev/null
      - name: Apply v1.0.6 shared Google-account room quota and invitations
        run: |
          test -s v106-account-quota-share-overlay.b64
          base64 -d v106-account-quota-share-overlay.b64 > /tmp/wordquest-106.zip
          echo "09eda8db82dfbea22dbba05dc11909c172010217a3226b1cb02ca65d306d60ad  /tmp/wordquest-106.zip" | sha256sum --check
          unzip -tq /tmp/wordquest-106.zip
          unzip -oq /tmp/wordquest-106.zip -d source
          test -s source/database.rules.json
          python3 -m json.tool source/database.rules.json >/dev/null
          grep -q 'versionCode = 29' source/app/build.gradle.kts
          grep -q 'versionName = "1.0.6-account-room-quota"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline101"' source/app/build.gradle.kts
          grep -q 'WhatsApp' source/app/src/main/java/com/kelimebulmacasi/a1/FirebaseLiveArena.kt
          grep -q 'roomQuota' source/database.rules.json
          grep -q 'roomsPerAccountPerUtcDay = 10' source/app/src/main/java/com/kelimebulmacasi/a1/FirebaseLiveArena.kt
      - name: Keep only Copy and Share buttons in v1.0.7
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/app/src/main/java/com/kelimebulmacasi/a1/FirebaseLiveArena.kt")
          old = p.read_text(encoding="utf-8")
          button = '                OutlinedButton(onClick = { shareRoomCode(context, client.roomCode, true) }) { Text("WhatsApp") }\n'
          assert old.count(button) == 1
          p.write_text(old.replace(button, ""), encoding="utf-8")
          new = p.read_text(encoding="utf-8")
          assert 'Text("WhatsApp")' not in new
          assert 'Text("Kopyala")' in new and 'Text("Paylaş")' in new
          g = Path("source/app/build.gradle.kts")
          gradle = g.read_text(encoding="utf-8")
          assert gradle.count("versionCode = 29") == 1
          assert gradle.count('versionName = "1.0.6-account-room-quota"') == 1
          gradle = gradle.replace("versionCode = 29", "versionCode = 30")
          gradle = gradle.replace('versionName = "1.0.6-account-room-quota"', 'versionName = "1.0.7-share-only"')
          assert 'applicationIdSuffix = ".offline101"' in gradle
          g.write_text(gradle, encoding="utf-8")
          print("Only the duplicate WhatsApp button removed; Copy and Share retained")
          PY
      - name: Apply v1.0.8 account nicknames and safe account deletion
        run: |
          test -s v108-nickname-account-delete-overlay.b64
          base64 -d v108-nickname-account-delete-overlay.b64 > /tmp/wordquest-108-overlay.zip
          echo "19126a9899d7ab05309c2c62be7d381b0538b3406b7f1be1362c3185d62c777d  /tmp/wordquest-108-overlay.zip" | sha256sum --check
          unzip -tq /tmp/wordquest-108-overlay.zip
          unzip -oq /tmp/wordquest-108-overlay.zip -d source
          (cd source && git apply --check ../v108-accounts-visibility-fix.patch && git apply ../v108-accounts-visibility-fix.patch)
          grep -q 'versionCode = 31' source/app/build.gradle.kts
          grep -q 'versionName = "1.0.8-player-nicknames"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline101"' source/app/build.gradle.kts
          grep -q 'hostName' source/app/src/main/java/com/kelimebulmacasi/a1/FirebaseLiveArena.kt
          grep -q 'guestName' source/app/src/main/java/com/kelimebulmacasi/a1/FirebaseLiveArena.kt
          test -s source/app/src/test/java/com/kelimebulmacasi/a1/ArenaNicknameTest.kt
          test -s source/app/src/test/java/com/kelimebulmacasi/a1/AccountDeletionUiContractTest.kt
          grep -q 'deleteWordQuestAccount' source/app/src/main/java/com/kelimebulmacasi/a1/Accounts.kt
          grep -q 'accountDeleteBusy' source/app/src/main/java/com/kelimebulmacasi/a1/AppSession.kt
          python3 -m json.tool source/database.rules.json >/dev/null
      - name: Apply v1.0.9 friends, names, account sign-in and deletion
        run: |
          test -s v109-source-overlay.b64
          base64 -d v109-source-overlay.b64 > /tmp/wordquest-v109-overlay.zip
          unzip -tq /tmp/wordquest-v109-overlay.zip
          unzip -oq /tmp/wordquest-v109-overlay.zip -d source
          (cd source && git apply --check ../v109-compile-fix.patch && git apply ../v109-compile-fix.patch)
          grep -q 'versionCode = 32' source/app/build.gradle.kts
          grep -q 'versionName = "1.0.9-account-friends"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline101"' source/app/build.gradle.kts
          test -s source/app/src/main/java/com/kelimebulmacasi/a1/FriendsHub.kt
          python3 -m json.tool source/database.rules.json >/dev/null
      - name: Apply v1.0.10 app-wide live friend and room request popups
        run: |
          test -s v110-live-notifications-overlay.b64
          base64 -d v110-live-notifications-overlay.b64 > /tmp/wordquest-v110-overlay.zip
          unzip -tq /tmp/wordquest-v110-overlay.zip
          unzip -oq /tmp/wordquest-v110-overlay.zip -d source
          grep -q 'versionCode = 33' source/app/build.gradle.kts
          grep -q 'versionName = "1.0.10-live-invitations"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline101"' source/app/build.gradle.kts
          grep -q 'activeAlert' source/app/src/main/java/com/kelimebulmacasi/a1/HomeScreen.kt
          test -s source/app/src/test/java/com/kelimebulmacasi/a1/SocialAlertTest.kt
      - name: Apply v1.0.11 Premium Arena and A1-A2 content library
        run: |
          test -s v111-premium-a1-a2-overlay.b64
          base64 -d v111-premium-a1-a2-overlay.b64 > /tmp/wq-v111.zip
          unzip -tq /tmp/wq-v111.zip
          unzip -oq /tmp/wq-v111.zip -d source
          grep -q 'versionCode = 34' source/app/build.gradle.kts
          grep -q 'versionName = "1.0.11-premium-a1-a2"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline101"' source/app/build.gradle.kts
          test -s source/app/src/main/java/com/kelimebulmacasi/a1/PremiumArenaScreen.kt
          test -s source/app/src/test/java/com/kelimebulmacasi/a1/PremiumArenaRulesTest.kt
          python3 source/tools/verify_premium_arena_content.py
      - name: Apply v1.0.12 realtime Premium Arena multiplayer migration
        run: |
          test -s v112-premium-online-overlay.b64
          base64 -d v112-premium-online-overlay.b64 > /tmp/wordquest-v112-overlay.zip
          unzip -tq /tmp/wordquest-v112-overlay.zip
          unzip -oq /tmp/wordquest-v112-overlay.zip -d source
          (cd source && git apply --check ../v112-compile-fix.patch && git apply ../v112-compile-fix.patch)
          (cd source && git apply --check ../v112-premium-theme-fix.patch && git apply ../v112-premium-theme-fix.patch)
          (cd source && git apply --check ../v112-team-timer-fix.patch && git apply ../v112-team-timer-fix.patch)
          grep -q 'versionCode = 35' source/app/build.gradle.kts
          grep -q 'versionName = "1.0.12-premium-online"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline101"' source/app/build.gradle.kts
          test -s source/app/src/main/java/com/kelimebulmacasi/a1/PremiumOnlineRoom.kt
          test -s source/app/src/main/java/com/kelimebulmacasi/a1/PremiumOnlineScreen.kt
          test -s source/app/src/test/java/com/kelimebulmacasi/a1/PremiumOnlineRulesTest.kt
          python3 -m json.tool source/database.rules.json >/dev/null
          python3 - <<'PY'
          import json
          with open('source/database.rules.json', encoding='utf8') as f:
              rules=json.load(f)['rules']
          assert all(k in rules for k in ('rooms','premiumRooms','roomQuota','friends','roomInvites'))
          assert 'premiumRooms' in rules['roomInvites']['$receiver']['$sender']['.validate']
          print('Premium room and invite rules: valid JSON')
          PY
      - name: Apply v1.0.13 fair turns, automatic timer and compact responsive Arena
        run: |
          test -s v113-premium-ux-overlay.b64
          base64 -d v113-premium-ux-overlay.b64 > /tmp/wq-v113-overlay.zip
          echo "7bbeaa5a85f38803bfb07cd7d13588614cfcaa41aae90e5b1e95d3375eec9f34  /tmp/wq-v113-overlay.zip" | sha256sum -c -
          unzip -tq /tmp/wq-v113-overlay.zip
          unzip -oq /tmp/wq-v113-overlay.zip -d source
          grep -q 'versionCode = 36' source/app/build.gradle.kts
          grep -q 'versionName = "1.0.13-premium-arena-ux"' source/app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".offline101"' source/app/build.gradle.kts
          python3 -m json.tool source/database.rules.json > /dev/null
          grep -q 'fun passIfExpired()' source/app/src/main/java/com/kelimebulmacasi/a1/PremiumOnlineRoom.kt
          grep -q 'Yeni oyuna başlamak ister misiniz?' source/app/src/main/java/com/kelimebulmacasi/a1/PremiumOnlineScreen.kt
      - name: Apply v1.0.14 live typed letters, two-player unknown and score penalties
        run: |
          test -s v114-answer-feedback-overlay.b64
          base64 -d v114-answer-feedback-overlay.b64 > /tmp/wq-v114-overlay.zip
          echo "a2704d5f8dec8c9659a8db6cc3b7170f5b199a6c0a44136676c599a32c0a9382  /tmp/wq-v114-overlay.zip" | sha256sum -c -
          unzip -tq /tmp/wq-v114-overlay.zip
          unzip -oq /tmp/wq-v114-overlay.zip -d source
          grep -q 'versionCode = 37' source/app/build.gradle.kts
          grep -q 'versionName = "1.0.14-premium-answers"' source/app/build.gradle.kts
