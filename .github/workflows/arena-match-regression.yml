name: Arena match regression
on:
  push:
    branches: ['feature/v150-arena-nextgen']
    paths:
      - 'tools/v132_engine/**'
      - '.github/workflows/arena-match-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arena-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test authoritative match, reconnection and social actions
        run: node --test tools/v132_engine/match_service.test.mjs tools/v132_engine/connection.test.mjs tools/v132_engine/social.test.mjs
