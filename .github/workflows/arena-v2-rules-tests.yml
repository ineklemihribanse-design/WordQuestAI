name: Verify Arena V2 Firebase Rules (Emulator)
on:
  push:
    branches: [feature/148-arena-rebuild]
    paths:
      - 'tools/v148/apply_arena_rules_v2.py'
      - 'tools/v148/test_arena_firebase_rules.mjs'
      - '.github/workflows/arena-v2-rules-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arena-v2-firebase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage Arena v2 rules without production deployment
        run: |
          set -euo pipefail
          mkdir -p source
          base64 -d v120-multi-ai-arena-overlay.b64 > /tmp/wq-arena-v120.zip
          unzip -p /tmp/wq-arena-v120.zip database.rules.json > source/database.rules.json
          python3 tools/v148/apply_arena_rules_v2.py
          python3 -m json.tool source/database.rules.json >/dev/null
          printf '{"database":{"rules":"source/database.rules.json"},"emulators":{"database":{"host":"127.0.0.1","port":9000},"ui":{"enabled":false}}}\n' > firebase.json
      - name: Install isolated local Firebase test dependencies
        run: |
          npm init -y
          npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@latest
      - name: Run deny/allow tests with no real cloud database
        run: npx firebase emulators:exec --project demo-wordquest-arena-v2 --only database "node tools/v148/test_arena_firebase_rules.mjs"
