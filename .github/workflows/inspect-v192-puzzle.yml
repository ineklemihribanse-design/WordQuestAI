name: Inspect assembled crossword UI for v192
on:
  push:
    branches: [fix/v190-tablet-board-and-visible-icons]
    paths: ['.github/workflows/inspect-v192-puzzle.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin exact successful 1.0.91 source snapshot for inspection
        run: |
          echo "WQ190_FULL_KEY=wq190-source-v1-64e0b1145aff4e175abd8a1d28e47abdd24a3492d8ff0ad8e86494d6a19292e8" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: source
        with:
          path: source
          key: ${{ env.WQ190_FULL_KEY }}
      - name: Display source-level non-secret layout only
        env:
          HIT: ${{ steps.source.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$HIT" = true
          python3 - <<'PY'
          from pathlib import Path
          s=Path("source/app/src/main/java/com/kelimebulmacasi/a1/PuzzleScreen.kt").read_text()
          for name,first,last in (
            ("draft","var inlineTyping by remember", "    Box("),
            ("submit","fun submitInlineWord()", "    val inlineEditor: @Composable () -> Unit ="),
            ("editor","val inlineEditor: @Composable () -> Unit =", "    Box("),
            ("board","private fun BoardFrame(", "@Composable\nprivate fun WordFields("),
          ):
            start=s.index(first)
            end=s.find(last,start+len(first))
            block=s[start:end] if name in ("board","submit") else s[start:start+5500]
            print("=== "+name+" source ===")
            print(block[:16000])
          PY
