name: Test v150 shared round, reaction and finish protocol
on:
  pull_request:
    branches: [fix/v190-tablet-board-and-visible-icons]
    paths: ['firebase/database.rules.v132.json','tools/v132_engine/**','tools/arena_v150_server/**','.github/workflows/qa-v132-engine-rules.yml']
permissions:
  contents: read
jobs:
  test:
    if: github.head_ref == 'feature/v150-arena-nextgen' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployable Workers bundle using verified existing bank (no deployment)
        working-directory: tools/arena_v150_server
        run: |
          npm install --no-audit --no-fund
          npm run free:prepare
          npm run free:check
      - name: Verify startup readiness gate and exact HD rule fragment
        run: |
          python3 -m unittest discover -s tools/auto_release -p test_wait_app_ready.py -v
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'tools/v132_engine')
          from prepare_friend_hd_rules import NODE
          assert json.load(open('firebase/friendMascotHd.fragment.json')) == {'friendMascotHd':NODE}
          PY
      - name: Test trusted connection state transitions
        run: node --test tools/v132_engine/connection.test.mjs tools/v132_engine/connection_store.test.mjs tools/v132_engine/duel.test.mjs tools/v132_engine/quiz.test.mjs tools/v132_engine/coop.test.mjs tools/v132_engine/team.test.mjs tools/v132_engine/match_service.test.mjs tools/v132_engine/arena_gateway.test.mjs tools/v132_engine/lobby.test.mjs tools/v132_engine/lobby_gateway.test.mjs tools/v132_engine/social.test.mjs tools/v132_engine/profiles.test.mjs tools/v132_engine/presence.test.mjs tools/v132_engine/room_storage.test.mjs tools/arena_v150_server/trusted_bank.test.mjs tools/arena_v150_server/vocabulary_bank.test.mjs tools/arena_v150_server/free_room_adapter.test.mjs
      - run: |
          printf '{"database":{"rules":"firebase/database.rules.v132.json"},"emulators":{"database":{"host":"127.0.0.1","port":9000},"ui":{"enabled":false}}}\n' > firebase.json
          npm init -y
          npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@6.0.0
          python3 tools/v132_engine/prepare_friend_hd_rules.py --live firebase/database.rules.v132.json --output "$RUNNER_TEMP/friend-hd-candidate.json"
          npx firebase emulators:exec --project demo-wordquest --only database "node tools/v132_engine/test_rules.mjs && WQ_HD_RULES=$RUNNER_TEMP/friend-hd-candidate.json node tools/v132_engine/test_friend_hd.mjs"
