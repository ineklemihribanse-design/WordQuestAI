name: Test v150 shared round, reaction and finish protocol
on:
  pull_request:
    branches: [fix/v190-tablet-board-and-visible-icons]
    paths: ['firebase/database.rules.v132.json','tools/v132_engine/**','.github/workflows/qa-v132-engine-rules.yml']
permissions:
  contents: read
jobs:
  test:
    if: github.head_ref == 'feature/v150-arena-nextgen' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test trusted connection state transitions
        run: node --test tools/v132_engine/connection.test.mjs tools/v132_engine/connection_store.test.mjs tools/v132_engine/duel.test.mjs tools/v132_engine/quiz.test.mjs tools/v132_engine/coop.test.mjs tools/v132_engine/team.test.mjs tools/v132_engine/match_service.test.mjs tools/v132_engine/arena_gateway.test.mjs tools/v132_engine/lobby.test.mjs tools/v132_engine/lobby_gateway.test.mjs tools/v132_engine/social.test.mjs tools/v132_engine/profiles.test.mjs tools/v132_engine/presence.test.mjs tools/v132_engine/room_storage.test.mjs tools/arena_v150_server/trusted_bank.test.mjs tools/arena_v150_server/vocabulary_bank.test.mjs
      - run: |
          printf '{"database":{"rules":"firebase/database.rules.v132.json"},"emulators":{"database":{"host":"127.0.0.1","port":9000},"ui":{"enabled":false}}}\n' > firebase.json
          npm init -y
          npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@6.0.0
          npx firebase emulators:exec --project demo-wordquest --only database "node tools/v132_engine/test_rules.mjs"
