name: Test v150 shared round, reaction and finish protocol
on:
  push:
    branches: [feature/v150-arena-nextgen]
    paths:
      - 'firebase/**'
      - 'assets/user_uploads/**'
      - 'tools/v132_engine/**'
      - 'tools/arena_v150_server/**'
      - 'tools/maintenance/**'
      - 'tools/auto_release/**'
      - 'tools/v150_release/**'
      - '.github/workflows/qa-v132-engine-rules.yml'
      - '.github/workflows/publish-v151-approved.yml'
permissions:
  contents: read
concurrency:
  group: wq-development-scope-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    if: github.repository == 'ineklemihribanse-design/WordQuestAI' && github.ref == 'refs/heads/feature/v150-arena-nextgen'
    runs-on: ubuntu-latest
    outputs:
      level: ${{ steps.scope.outputs.level }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify exact pushed commit range
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/maintenance -p test_classify_release_impact.py -v
          python3 tools/maintenance/classify_release_impact.py --base "$BEFORE" --head "$GITHUB_SHA" | tee "$RUNNER_TEMP/scope.json"
          level=$(jq -r .level "$RUNNER_TEMP/scope.json")
          case "$level" in fast|standard|full) ;; *) exit 1;; esac
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "Development validation: $level (not APK publication)" >> "$GITHUB_STEP_SUMMARY"
  visual:
    needs: scope
    if: needs.scope.outputs.level == 'fast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check Pillow
      - run: python3 tools/maintenance/verify_arena_art.py
  standard:
    needs: scope
    if: needs.scope.outputs.level == 'standard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Arena shared gameplay protocols and readiness
        run: |
          python3 -m unittest discover -s tools/auto_release -p test_wait_app_ready.py -v
          node --test tools/v132_engine/engine.test.mjs tools/v132_engine/connection.test.mjs tools/v132_engine/connection_store.test.mjs tools/v132_engine/duel.test.mjs tools/v132_engine/quiz.test.mjs tools/v132_engine/coop.test.mjs tools/v132_engine/team.test.mjs tools/v132_engine/lobby.test.mjs tools/v132_engine/lobby_gateway.test.mjs tools/v132_engine/social.test.mjs tools/v132_engine/profiles.test.mjs
      - run: echo "Kotlin compile, Lint, exact APK upgrade and viewport tests remain mandatory in the release workflow." >> "$GITHUB_STEP_SUMMARY"
  test:
    needs: scope
    if: needs.scope.outputs.level == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployable Workers bundle using verified existing bank (no deployment)
        working-directory: tools/arena_v150_server
        run: |
          npm install --no-audit --no-fund
          npm run free:prepare
          npm run free:check
      - name: Verify startup readiness gate and exact HD rule fragment
        run: |
          python3 -m unittest discover -s tools/auto_release -p test_wait_app_ready.py -v
          python3 - <<'PY'
          import json,sys
          sys.path.insert(0,'tools/v132_engine')
          from prepare_friend_hd_rules import NODE
          assert json.load(open('firebase/friendMascotHd.fragment.json')) == {'friendMascotHd':NODE}
          PY
      - name: Test trusted connection state transitions
        run: node --test tools/v132_engine/connection.test.mjs tools/v132_engine/connection_store.test.mjs tools/v132_engine/duel.test.mjs tools/v132_engine/quiz.test.mjs tools/v132_engine/coop.test.mjs tools/v132_engine/team.test.mjs tools/v132_engine/match_service.test.mjs tools/v132_engine/arena_gateway.test.mjs tools/v132_engine/lobby.test.mjs tools/v132_engine/lobby_gateway.test.mjs tools/v132_engine/social.test.mjs tools/v132_engine/profiles.test.mjs tools/v132_engine/presence.test.mjs tools/v132_engine/room_storage.test.mjs tools/arena_v150_server/trusted_bank.test.mjs tools/arena_v150_server/vocabulary_bank.test.mjs tools/arena_v150_server/free_room_adapter.test.mjs
      - run: |
          printf '{"database":{"rules":"firebase/database.rules.v132.json"},"emulators":{"database":{"host":"127.0.0.1","port":9000},"ui":{"enabled":false}}}\n' > firebase.json
          npm init -y
          npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@6.0.0
          python3 tools/v132_engine/prepare_friend_hd_rules.py --live firebase/database.rules.v132.json --output "$RUNNER_TEMP/friend-hd-candidate.json"
          npx firebase emulators:exec --project demo-wordquest --only database "node tools/v132_engine/test_rules.mjs && WQ_HD_RULES=$RUNNER_TEMP/friend-hd-candidate.json node tools/v132_engine/test_friend_hd.mjs"
