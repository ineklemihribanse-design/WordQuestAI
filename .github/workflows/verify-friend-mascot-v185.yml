name: Verify private friend mascot preview rules (v1.0.85)
on:
  push:
    branches: [feature/v185-profile-friend-personal-mascots]
    paths:
      - '.github/workflows/verify-friend-mascot-v185.yml'
      - 'scripts/test-friend-mascot-v185.mjs'
      - 'firebase/database.rules.v185.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact v185 RTDB emulator rules
        run: |
          set -euo pipefail
          python3 -m json.tool firebase/database.rules.v185.json >/dev/null
          printf '{"database":{"rules":"firebase/database.rules.v185.json"},"emulators":{"database":{"host":"127.0.0.1","port":9001},"ui":{"enabled":false}}}\n' > firebase.json
      - name: Install local no-billing Firebase test SDK
        run: npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@latest
      - name: Verify opt-in preview authorization and revocation
        run: npx firebase emulators:exec --project demo-wordquest-friends --only database "node scripts/test-friend-mascot-v185.mjs"
