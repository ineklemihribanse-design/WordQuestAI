name: WordQuest AI 1.0.83 fast source and ZIP contract tests
on:
  push:
    branches: [feature/v183-quality-stability]
    paths:
      - 'tools/v183/**'
      - 'tools/v182/**'
      - '.github/workflows/verify-v183-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source and safe ZIP template regression tests
        run: |
          set -euo pipefail
          python3 tools/v183/test_contracts_183.py
          python3 tools/v183/audit_icons_183.py
          git diff --exit-code tools/v183/ICON_INVENTORY_183.md
