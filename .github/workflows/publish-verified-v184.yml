name: Publish complete WordQuest AI 1.0.84 update

on:
  push:
    branches:
      - feature/v184-mascot-victory-arena
    paths:
      - .github/workflows/publish-verified-v184.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: wordquest-v184-cumulative-public-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require full 1.0.83 plus 1.0.84 and successful signed emulator QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID=45022462888
          VERIFIED_SHA=470ae1c6a5bb5231d6337dd18d3e14224de40edf
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)" = "$VERIFIED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .event)" = push
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" \
             --jq '.jobs[].steps[] | "\(.name)|\(.conclusion)"' > /tmp/wq184-verified-steps
          for step in \
            'Apply 1.0.83 quiz contrast, protected mascot ZIP and responsive Arena' \
            'Apply 1.0.84 approved Arena art, full-size custom mascots, win poses' \
            'Build Android APK and run JVM tests' \
            'Test genuine signed v1.0.82 to v1.0.84 in-place emulator installation' \
            'Archive signed 1.0.84 QA APK only after successful in-place upgrade test'; do
            grep -Fxq "$step|success" /tmp/wq184-verified-steps
          done
          echo "VERIFIED_SHA=$VERIFIED_SHA" >> "$GITHUB_ENV"
          echo "PASS: v1.0.83 features plus v1.0.84 and signed data-preserving upgrade"

      - name: Download exact signed and verified APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 45022462888 -R "$GITHUB_REPOSITORY" \
            --name WordQuestAI-v1.0.84-code110-signed-QA-673 --dir dist
          test -s dist/WordQuestAI-v1.0.84-signed-qa.apk
          mv dist/WordQuestAI-v1.0.84-signed-qa.apk dist/WordQuestAI.apk
          test "$(stat -c %s dist/WordQuestAI.apk)" -gt 100000000
          unzip -tq dist/WordQuestAI.apk
          echo "PASS: trusted immutable signed QA artifact"

      - name: Validate original Android identity, signature, version and upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$AAPT" ] || [ ! -x "$SIGNER" ]; then
            sdkmanager --install 'build-tools;35.0.0' >/dev/null
          fi
          test -x "$AAPT" && test -x "$SIGNER"
          "$AAPT" dump badging dist/WordQuestAI.apk > dist/badging.txt
          "$SIGNER" verify --verbose --print-certs dist/WordQuestAI.apk > dist/signature.txt
          grep -Fq "name='com.kelimebulmacasi.a1.practice.fresh'" dist/badging.txt
          grep -Fq "versionCode='110'" dist/badging.txt
          grep -Fq "versionName='1.0.84'" dist/badging.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/signature.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' dist/signature.txt
          grep -Fiq 'Signer #1 certificate SHA-256 digest: 29f9449cef86e511bb8256ca1db58580ff88dd1badd034ff79b81c6df662bce6' dist/signature.txt
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$latest" = 'v1.0.84' ]; then
            echo "ALREADY_PUBLISHED=1" >> "$GITHUB_ENV"
            echo "Already published; refusing overwrite"
            exit 0
          fi
          case "$latest" in v1.0.82|v1.0.83) ;; *) echo "Unexpected latest public version: $latest" >&2; exit 1;; esac
          mkdir -p previous
          gh release download "$latest" -R "$GITHUB_REPOSITORY" --pattern update.json --dir previous
          python3 - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('previous/update.json').read_text())
          assert d['packageName']=='com.kelimebulmacasi.a1.practice.fresh'
          assert d['versionCode']<110
          assert d['tag'] in ('v1.0.82','v1.0.83')
          print('PASS: cumulative 1.0.84 supersedes',d['tag'])
          PY

      - name: Generate in-app update metadata from actual signed APK
        if: ${{ env.ALREADY_PUBLISHED != '1' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          apk=pathlib.Path('dist/WordQuestAI.apk')
          meta={
            'schemaVersion':1,
            'tag':'v1.0.84',
            'versionCode':110,
            'versionName':'1.0.84',
            'packageName':'com.kelimebulmacasi.a1.practice.fresh',
            'apkFile':'WordQuestAI.apk',
            'sizeBytes':apk.stat().st_size,
            'sha256':hashlib.sha256(apk.read_bytes()).hexdigest(),
            'notes':('WordQuest AI 1.0.84, 1.0.83 sürümünün tüm özelliklerini içerir. '
                     'Arena, 5 şıklı düello, kelime hafızam, kişisel ZIP maskotları ve '
                     'mevcut oyunlar korunur. Kişisel maskotlar büyütüldü, kupa kaldıran '
                     'zafer pozları bağlandı, şeffaf kenar boşlukları düzeltildi ve '
                     'onaylı mor-altın Arena sahnesi telefon/tablet için geri getirildi. '
                     'Önceki kayıtlar ve mevcut uygulama kimliği korunur. '
                     'Gerçek cihazda görünüm ve çevrimiçi Arena ayrıca kontrol edilmelidir.')
          }
          assert meta['sizeBytes']>100_000_000
          pathlib.Path('dist/update.json').write_text(
            json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PASS: release checksum',meta['sha256'])
          PY

      - name: Publish signed complete 1.0.84 to in-app Updates
        if: ${{ env.ALREADY_PUBLISHED != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          case "$now" in v1.0.82|v1.0.83) ;; *) echo "Release feed advanced unexpectedly" >&2; exit 1;; esac
          if gh release view v1.0.84 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.84 already exists; do not overwrite immutable release'
            exit 1
          fi
          gh release create v1.0.84 dist/WordQuestAI.apk dist/update.json \
            -R "$GITHUB_REPOSITORY" --target "$VERIFIED_SHA" --latest \
            --title 'WordQuest AI 1.0.84 — 1.0.83 Tam İçerik + Arena ve Maskot Düzeltmeleri' \
            --notes 'WordQuest AI v1.0.84 / code 110. 1.0.83 tam içerik üzerine kişisel maskot boyutu, kupa zafer görselleri, şeffaf kırpma ve orijinal Arena sahnesi. Kotlin/JVM, mevcut imza ve Android 1.0.82 -> 1.0.84 veri koruyan emülatör güncellemesi geçti. Gerçek cihazda görsel ve çevrimiçi test ayrıca gereklidir.'
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v1.0.84
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.84" --jq '[.assets[].name] | sort | join(",")')" = 'WordQuestAI.apk,update.json'
          echo 'PASS: installed Settings > Updates now discovers v1.0.84'
