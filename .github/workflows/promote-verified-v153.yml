name: Promote verified WordQuest AI 1.0.153
on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-verified-v153.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: wordquest-public-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ineklemihribanse-design/WordQuestAI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: '46066640366'
      VERIFIED_SHA: cecc852a127f701279c25d4b1dce375662ae9f5f
      VERIFIED_ARTIFACT: '15231622779'
      BASE_SHA: 3efae42a948ebd3dd77bacc88e01087aeb43ba593ec7030bbf87e04a65c952be
    steps:
      - name: Require exact successful audited release run
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" > "$RUNNER_TEMP/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/jobs" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN/artifacts" > "$RUNNER_TEMP/artifacts.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          d=Path(os.environ['RUNNER_TEMP'])
          r=json.loads((d/'run.json').read_text())
          j=json.loads((d/'jobs.json').read_text())
          a=json.loads((d/'artifacts.json').read_text())
          assert r['head_sha']==os.environ['VERIFIED_SHA'] and r['conclusion']=='success'
          assert {'audit','verify'}<={x['name'] for x in j['jobs'] if x['conclusion']=='success'}
          assert any(str(x['id'])==os.environ['VERIFIED_ARTIFACT'] and x['name']=='WordQuestAI-v1.0.153-verified-release' and not x['expired'] for x in a['artifacts'])
          PY
      - uses: actions/download-artifact@v4
        with:
          name: WordQuestAI-v1.0.153-verified-release
          run-id: 46066640366
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified
      - name: Verify bytes and publish approved package without rebuilding
        run: |
          set -euo pipefail
          export D="$RUNNER_TEMP/verified"
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          d=Path(os.environ['D']); out=d/'dist'
          m=json.loads((out/'update.json').read_text()); p=m['deltas'][0]
          def sha(f):
              with f.open('rb') as s:return hashlib.file_digest(s,'sha256').hexdigest()
          assert m['versionName']=='1.0.153' and m['versionCode']==167 and m['tag']=='v1.0.153'
          assert m['packageName']=='com.kelimebulmacasi.a1.practice.fresh' and m['apkFile']=='WordQuestAI.apk'
          assert p['fromVersionCode']==166 and p['toVersionCode']==167 and p['baseSha256']==os.environ['BASE_SHA']
          assert p['file']=='WordQuestAI-166-to-167.wqd.gz'
          assert sha(out/'WordQuestAI.apk')==m['sha256']==p['targetSha256']==(d/'upgrade-proof.sha256').read_text().split()[0]
          assert (out/'WordQuestAI.apk').stat().st_size==m['sizeBytes']
          assert sha(out/p['file'])==p['sha256'] and (out/p['file']).stat().st_size==p['sizeBytes']
          assert {f.name for f in out.iterdir()}=={'WordQuestAI.apk','update.json',p['file']}
          PY
          TAG=v1.0.153
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          test "$latest" = v1.0.152 || test "$latest" = "$TAG"
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$latest" = v1.0.152
            gh release create "$TAG" "$D/dist/"* -R "$GITHUB_REPOSITORY" --target "$VERIFIED_SHA" --draft --title "WordQuest AI 1.0.153 — Arena düzeltmeleri" --notes "Telefon ve kısa yatay tablet yerleşimi, görünür işlem düğmeleri, arkadaş profili ve Arena giriş iyileştirmeleri. Mevcut imza ve kurulum korunur."
          fi
          ID="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID" > "$D/uploaded.json"
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          d=Path(os.environ['D']);r=json.loads((d/'uploaded.json').read_text())
          assert r['tag_name']=='v1.0.153' and not r['prerelease'] and r['target_commitish']==os.environ['VERIFIED_SHA']
          files={f.name:f for f in (d/'dist').iterdir()}
          assert len(r['assets'])==3 and set(files)=={a['name'] for a in r['assets']}
          for a in r['assets']:
              f=files[a['name']]
              with f.open('rb') as s: digest=hashlib.file_digest(s,'sha256').hexdigest()
              assert a['state']=='uploaded' and a['size']==f.stat().st_size and a['digest']=='sha256:'+digest
          PY
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" --jq .draft)" = true ]; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = v1.0.152
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true --jq '{tag:.tag_name,draft:.draft}'
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "$TAG"
