name: Test hybrid Arena existing HD and quota rules
on:
  pull_request:
    branches: [fix/v190-tablet-board-and-visible-icons]
    paths: ['firebase/database.rules.v128.json','tools/v128_lobby/**','.github/workflows/qa-v130-hybrid-rules.yml']
permissions:
  contents: read
jobs:
  test:
    if: github.head_ref == 'feature/v130-hybrid-lobby'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          printf '{"database":{"rules":"firebase/database.rules.v128.json"},"emulators":{"database":{"host":"127.0.0.1","port":9000},"ui":{"enabled":false}}}\n' > firebase.json
          npm init -y
          npm install --no-save firebase-tools@latest @firebase/rules-unit-testing@6.0.0
          npx firebase emulators:exec --project demo-wordquest --only database "node tools/v128_lobby/test_rules.mjs"
