name: WordQuest v0.8.0 offline APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/android-offline-apk.yml'

jobs:
  build:
    name: Compile and validate independent APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform and tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify US/UK audio and IPA assets
        run: python3 tools/verify_audio_ipa.py
      - name: Build and run JVM tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testOfflineUnitTest :app:assembleOffline
      - name: Verify generated APK and signature
        run: |
          APK="$(find app/build/outputs/apk/offline -name '*.apk' -type f | head -1)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -10
          unzip -t "$APK" | tail -2
          echo "APK=$APK" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: WordQuestAI-v0.8.0-Offline-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
